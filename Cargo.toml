[workspace]
resolver = "2"
members = [
    "crates/libtorrent-sys",
    "crates/libtorrent-safe",
    "crates/seederd-engine",
    "crates/seederd",
    "crates/seederd-bench",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
authors = ["Justin Chung"]
repository = "https://github.com/d18580b/torrent"

[workspace.dependencies]
# Core
tokio = { version = "1.42", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
hyper = "1"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-futures = "0.2"
prometheus = { version = "0.13", default-features = false }

# Concurrency
dashmap = "6"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Bit flag types
bitflags = { version = "2", features = ["serde"] }

# Errors
thiserror = "2"
anyhow = "1"

# Utility
bytes = "1"
hex = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
tempfile = "3"
once_cell = "1"

# Net / VPN
rtnetlink = "0.14"
netlink-packet-route = "0.19"

# Internal crates
libtorrent-sys = { path = "crates/libtorrent-sys" }
libtorrent-safe = { path = "crates/libtorrent-safe" }
seederd-engine = { path = "crates/seederd-engine" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1            # keep frame pointers for production debugging
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 2
strip = "none"
