[workspace]
resolver = "2"
members = [
    "crates/libtorrent-sys",
    "crates/libtorrent-safe",
    "crates/torrentd-engine",
    "crates/torrentd-pool",
    "crates/torrentd",
    "crates/torrentd-bench",
    "crates/torrentctl",
]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Justin Chung"]
repository = "https://github.com/d18580b/torrent"

# Centralized, inherited lint policy — each crate opts in via `[lints] workspace = true`.
# One source of truth (merge-resilient) that mirrors the historical `-D warnings` gate.
[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
# Core
tokio = { version = "1.54", features = ["full"] }
kynos = { version = "=0.6.2",features = ["openapi32", "pattern", "time-jiff1"] }
jiff = { version = "1.0", features = ["serde"] }
base64 = "0.23"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-futures = "0.2"
prometheus = { version = "0.14", default-features = false }

# Traces (torrentd::telemetry): OpenTelemetry over OTLP, off by default.
# Default features off throughout: no metrics or logs signal, and no
# `internal-logs`, whose own lines would duplicate the daemon's rate-limited
# export WARN. gRPC goes over tonic with rustls (aws-lc-rs, the provider
# reqwest's `rustls` feature uses, so only one is built) and the system's
# roots; http/protobuf goes over the reqwest below, through
# `telemetry::BlockingHttp`, so no second reqwest is built.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "tls-aws-lc", "tls-roots"] }
opentelemetry-http = { version = "0.33", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }

# Concurrency
dashmap = "6"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Bit flag types
bitflags = { version = "2", features = ["serde"] }

# Errors
thiserror = "2"
anyhow = "1"

# Streams
async-stream = "0.3"
futures-util = "0.3"

# Auth
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"

# Pool index
rusqlite = { version = "0.43", features = ["bundled"] }
jwalk = "0.9"

# Utility
bytes = "1"
# The body trait kynos' request body implements, to read one under a deadline
# (`torrentd::http::v1::TimedBody`); already in the tree through kynos.
http-body = "1"
hex = { version = "0.4", features = ["serde"] }
sha1 = "0.11"
tempfile = "3"
once_cell = "1"
# `syncfs(2)` for the stores' batched writer and `getrlimit(2)` for the boot
# descriptor check; std exposes neither. Already in the lockfile through tokio.
libc = "0.2"

# torrentctl: the runtime the spargen-generated client needs. spargen audits
# these against its tested floors; reqwest keeps default features off.
# rustls over aws-lc-rs, verifying against the platform's trust store.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
secrecy = "0.10.3"
futures-core = "0.3.34"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
spargen = "=0.8.0"

# torrentctl: the terminal UI
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
color-eyre = "0.6.5"
etcetera = "0.11"
tracing-appender = "0.2.5"
tui-input = "0.15"
insta = "1.49"

# Property tests (dev-dependency only). `std` alone: no forking runner and no
# per-case timeout, so a case runs in the test's own thread like any test.
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Internal crates
libtorrent-sys = { path = "crates/libtorrent-sys" }
libtorrent-safe = { path = "crates/libtorrent-safe" }
torrentd-engine = { path = "crates/torrentd-engine" }
torrentd-pool = { path = "crates/torrentd-pool" }

# Dev and test builds give workspace crates line tables only and dependencies
# no debuginfo, so target/ stays small under fast iteration. Workspace
# backtraces keep file:line; dependency frames keep their symbol names but
# lose file:line. For full debuginfo when step-debugging:
#   CARGO_PROFILE_DEV_DEBUG=2 cargo ...                          # workspace crates
#   cargo --config 'profile.dev.package."*".debug=2' ...         # dependencies
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1            # keep frame pointers for production debugging
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 2
strip = "none"
