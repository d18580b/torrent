[workspace]
resolver = "2"
members = [
    "crates/libtorrent-sys",
    "crates/libtorrent-safe",
    "crates/seederd-engine",
    "crates/seederd-pool",
    "crates/seederd",
    "crates/seederd-bench",
]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Justin Chung"]
repository = "https://github.com/milkyisles/torrent"

# Centralized, inherited lint policy — each crate opts in via `[lints] workspace = true`.
# One source of truth (merge-resilient) that mirrors the historical `-D warnings` gate.
[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
# Core
tokio = { version = "1.42", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
hyper = "1"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt", "chrono"] }
tracing-futures = "0.2"
prometheus = { version = "0.13", default-features = false }

# Concurrency
dashmap = "6"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Bit flag types
bitflags = { version = "2", features = ["serde"] }

# Errors
thiserror = "2"
anyhow = "1"

# Web client
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
async-stream = "0.3"
futures-util = "0.3"

# Auth
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"

# Pool index
rusqlite = { version = "0.32", features = ["bundled"] }
jwalk = "0.8"

# Utility
bytes = "1"
hex = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
tempfile = "3"
once_cell = "1"

# Internal crates
libtorrent-sys = { path = "crates/libtorrent-sys" }
libtorrent-safe = { path = "crates/libtorrent-safe" }
seederd-engine = { path = "crates/seederd-engine" }
seederd-pool = { path = "crates/seederd-pool" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1            # keep frame pointers for production debugging
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 2
strip = "none"
