[workspace]
resolver = "2"
members = [
    "crates/libtorrent-sys",
    "crates/libtorrent-safe",
    "crates/torrentd-engine",
    "crates/torrentd-pool",
    "crates/torrentd",
    "crates/torrentd-bench",
    "crates/torrentctl",
]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Justin Chung"]
repository = "https://github.com/d18580b/torrent"

# Centralized, inherited lint policy — each crate opts in via `[lints] workspace = true`.
# One source of truth (merge-resilient) that mirrors the historical `-D warnings` gate.
[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
# Core
tokio = { version = "1.42", features = ["full"] }
kynos = { version = "=0.3.0", features = ["openapi32", "time-jiff"] }
jiff = { version = "0.2", features = ["serde"] }
base64 = "0.22"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt", "chrono"] }
tracing-futures = "0.2"
prometheus = { version = "0.13", default-features = false }

# Concurrency
dashmap = "6"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Bit flag types
bitflags = { version = "2", features = ["serde"] }

# Errors
thiserror = "2"
anyhow = "1"

# Streams
async-stream = "0.3"
futures-util = "0.3"

# Auth
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"

# Pool index
rusqlite = { version = "0.32", features = ["bundled"] }
jwalk = "0.8"

# Utility
bytes = "1"
hex = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
tempfile = "3"
once_cell = "1"

# torrentctl: the runtime the spargen-generated client needs. spargen audits
# these against its tested floors; reqwest keeps default features off.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
secrecy = "0.10.3"
futures-core = "0.3.32"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
spargen = "=0.5.0"

# torrentctl: the terminal UI
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
color-eyre = "0.6.5"
etcetera = "0.11"
tracing-appender = "0.2.5"
tui-input = "0.15"
insta = "1.48"

# Internal crates
libtorrent-sys = { path = "crates/libtorrent-sys" }
libtorrent-safe = { path = "crates/libtorrent-safe" }
torrentd-engine = { path = "crates/torrentd-engine" }
torrentd-pool = { path = "crates/torrentd-pool" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1            # keep frame pointers for production debugging
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 2
strip = "none"
