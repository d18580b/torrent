[package]
name = "torrentd-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "TorrentEngine trait, real + mock implementations, and orchestration for torrentd."
publish = false

[dependencies]
libtorrent-safe = { workspace = true }

# Async / concurrency
tokio = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
crossbeam-channel = { workspace = true }

# Logging
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Serialization (AssignmentRegistry's one-time JSON import)
serde = { workspace = true }
serde_json = { workspace = true }

# AssignmentRegistry's database
rusqlite = { workspace = true }

# Misc
bytes = { workspace = true }
hex = { workspace = true }
once_cell = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }

[features]
# The test doubles: `MockEngine`, `MockVpn` and `MockForwarder`. Compiled into
# this crate's own tests regardless; a dependent crate enables this for its
# tests (a dev-dependency) or for the alert drill's `fault-injection` build,
# and a release build of the daemon carries none of them.
test-support = []

[dev-dependencies]
# The willing-seeder test in tests/lifecycle.rs dials a peer and reads a
# torrent's payload download counter, which only `test-api` exposes.
libtorrent-safe = { workspace = true, features = ["test-api"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# Layer 3 integration fixtures: real SHA-1 piece hashes for generated .torrents.
sha1 = { workspace = true }

[lints]
workspace = true
