[package]
name = "seederd-pool"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Managed-root filesystem index, torrent library, and adoption matching for seederd."
publish = false

[dependencies]
libtorrent-safe = { workspace = true }

# Index store. `bundled` compiles SQLite from source, which this workspace
# already pays for many times over with Boost + libtorrent.
rusqlite = { workspace = true }

# Parallel filesystem walk — a managed root can hold millions of files.
jwalk = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
