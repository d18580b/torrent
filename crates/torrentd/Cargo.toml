[package]
name = "torrentd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless petabyte-scale torrent seeding daemon."
publish = false

[[bin]]
name = "torrentd"
path = "src/main.rs"

[dependencies]
torrentd-engine = { workspace = true }
torrentd-pool = { workspace = true }
libtorrent-safe = { workspace = true }

# Async runtime + HTTP
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }

# CLI / config
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Logging / metrics
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }

# Streams
async-stream = { workspace = true }
futures-util = { workspace = true }

# Auth
argon2 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

# Errors
anyhow = { workspace = true }
thiserror = { workspace = true }

# Misc
parking_lot = { workspace = true }
hex = { workspace = true }
sha1 = { workspace = true }

[features]
# The alert drill's build (deploy/drill): layers a MockEngine over every
# session and mounts `POST /api/fault` to queue alerts, stall the alert loop,
# or panic a task. Never enable it for a deployment; no release image does.
fault-injection = []

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
