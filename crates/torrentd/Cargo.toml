[package]
name = "torrentd"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless petabyte-scale torrent seeding daemon."
publish = false

[[bin]]
name = "torrentd"
path = "src/main.rs"

[dependencies]
torrentd-engine = { workspace = true }
torrentd-pool = { workspace = true }
libtorrent-safe = { workspace = true }

# Async runtime + HTTP
tokio = { workspace = true }
kynos = { workspace = true }
jiff = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }

# CLI / config
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Logging / metrics
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }

# Streams
async-stream = { workspace = true }
futures-util = { workspace = true }

# Auth
argon2 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

# Errors
anyhow = { workspace = true }
thiserror = { workspace = true }

# Misc
parking_lot = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
sha1 = { workspace = true }

# The assignment registry's database
rusqlite = { workspace = true }

[features]
# The alert drill's build (deploy/drill): layers a MockEngine over every
# session and mounts `POST /v1/faults` to queue alerts, stall the alert loop,
# or panic a task. Never enable it for a deployment. No release tarball or
# image is built with it: `mise run release-features` fails CI and the release
# workflow if the workspace's default build ever resolves it on, and
# scripts/dist refuses a torrentd whose OpenAPI document has its route. A binary built with it exits 78 at startup unless
# TORRENTD_FAULT_INJECTION=1 (which deploy/drill sets), and exports
# torrentd_build_fault_injection 1.
fault-injection = ["torrentd-engine/test-support"]

[dev-dependencies]
# The engine's test doubles, for this crate's unit tests only.
torrentd-engine = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# `test-util` pauses the clock, so a test can watch a 30-second request
# deadline expire without waiting for it (`http::tests::support::slow_body`),
# and the port-forward monitor's pacing tests run on it.
tokio = { workspace = true, features = ["test-util"] }
kynos = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }

[lints]
workspace = true
