[package]
name = "libtorrent-sys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Raw FFI bindings to libtorrent-rasterbar via a custom C shim."
publish = false
links = "libtorrent_shim"

[features]
default = ["bundled"]
# `bundled` (default) builds Boost (headers-only install) and libtorrent from
# the vendored submodules, then compiles the C shim. Without the feature no
# native build runs and the consuming crate must supply libtorrent + the shim
# symbols and the linker arguments itself (intended for system-package
# consumers).
#
# bindgen runs either way: wrapper.h reaches only the two C shim headers, which
# include nothing but <stddef.h>/<stdint.h>, so the generated bindings never
# depended on the native build. They are therefore complete in both
# configurations, and `--no-default-features` type-checks the whole workspace.
bundled = []

# Layer 2: the FFI shim's own tests, in `tests/shim.rs`. Gated because they
# read `.torrent` fixtures out of the vendored libtorrent checkout, so they
# need the submodule on disk even when a cached native prefix would otherwise
# make it unnecessary. `mise run test-shim`.
shim-tests = []

[dependencies]

[build-dependencies]
cc = "1.1"
cmake = "0.1"
bindgen = "0.70"
# Keying and staging the native cache. Both are already in Cargo.lock, so no
# new versions are resolved, but resolver v2 unifies build-dependencies
# separately from the normal graph -- they are compiled once more for the
# build-script graph.
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true
