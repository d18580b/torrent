[package]
name = "torrentd-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Layer 4 load harness for torrentd (alert throughput, memory scaling, startup time, pool scan/match/adopt preview at scale), held to budgets.toml."
publish = false

[[bin]]
name = "torrentd-bench"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# budgets.toml, compiled in.
serde = { workspace = true }
toml = { workspace = true }
# The synthetic pool is built in a temporary directory removed afterwards.
tempfile = { workspace = true }
torrentd-engine = { workspace = true }
torrentd-pool = { workspace = true }
libtorrent-safe = { workspace = true }

[lints]
workspace = true
