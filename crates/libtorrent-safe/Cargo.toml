[package]
name = "libtorrent-safe"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Safe RAII wrappers over libtorrent-sys."
publish = false

[dependencies]
libtorrent-sys = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
bitflags = { workspace = true }

[features]
# `Session::connect_peer` and `Session::total_payload_download`, which only a
# test has a use for: torrentd-engine's lifecycle tests enable it as a
# dev-dependency, so no build of the daemon carries either.
test-api = []

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
