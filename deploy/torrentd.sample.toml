# Sample torrentd configuration file.
#
# Copy to /etc/torrentd/torrentd.toml and edit. Unknown keys are a fatal
# startup error, in `[[profile]]` tables too, so a typo is caught rather than
# ignored. Every key is documented here; docs/running.md covers the deployment
# around them.

# ---------------------------------------------------------------------------
# Daemon-wide
# ---------------------------------------------------------------------------
default_save_path = "/data/torrents"
resume_dir        = "/var/lib/torrentd/resume"
torrent_dir       = "/var/lib/torrentd/torrents"
http_listen       = "127.0.0.1:8080"   # loopback by default
log_level         = "info"   # error | warn | info | debug (reloadable)

# The daemon refuses to start unless you either configure [auth] (see the
# bottom of this file) or say here that you do not want authentication. This
# sample takes the second option because it binds loopback, where access
# control is the reverse proxy's job. Delete this line and configure [auth]
# before exposing the API anywhere — a non-loopback bind without [auth] is
# refused outright.
#
# Read once, at startup, like [auth] and http_listen: editing any of the three
# takes effect on restart, not on SIGHUP. A reload after such an edit warns
# "requires daemon restart; ignored" and changes nothing.
allow_unauthenticated = true

# `resume_dir` and `torrent_dir` are roots: each profile gets its own
# subdirectory under them, named after the profile id. A profile may override
# either with an absolute path of its own — which is also how you point a
# profile at directories from a pre-profiles deployment, where resume files
# lived directly under the root.
#
# Optional. Defaults to <resume_dir>/../profile_assignments.json, which records
# which profile owns which info-hash.
# registry_path = "/var/lib/torrentd/profile_assignments.json"

# libtorrent settings overrides (applied on top of the high_performance_seed
# preset). All optional; omit any to use the preset's default.
connections_limit             = 10000
file_pool_size                = 1000
aio_threads                   = 8
max_concurrent_http_announces = 200
upload_rate_limit             = 0    # bytes/sec; 0 = unlimited

# Local Service Discovery announces to the local network segment. It is
# ignored for `network = "vpn"` profiles, which disable it unconditionally.
enable_lsd = false

# Default peer identity for profiles that do not set their own. A `vpn`
# profile must set its own — see below.
#
# These are defaults, not a shared identity: two profiles that both end up
# with the same effective `peer_fingerprint` / `user_agent` — one inheriting
# these, one spelling them out — are refused, because that is one peer-id
# prefix on the wire from two postures.
# peer_fingerprint = "-XX1234-"
# user_agent       = "libtorrent/2.0"

# Liveness: max age (seconds) of a WireGuard tunnel's latest handshake before
# the health monitor declares the profile down and pauses it. Catches a tunnel
# that keeps its address but has silently stopped handshaking. Default 180.
# vpn_handshake_max_age_secs = 180

# Defence-in-depth kill switch. When true, torrentd installs a fail-closed
# nftables table (`torrentd_ks`) confining the daemon's own egress to loopback
# and its vpn profiles' tunnel interfaces — so if a tunnel drops, the kernel
# drops the traffic regardless of libtorrent's socket bind or the 30s monitor.
# Also forces tracker DNS through the tunnel. Removed cleanly on SIGTERM.
#
# Requires `nft`, CAP_NET_ADMIN, at least one `network = "vpn"` profile, and a
# dedicated non-root user: the ruleset matches on the daemon's uid, and as root
# it would drop every root-owned process's traffic on the host. The packaged
# systemd unit uses User=torrentd.
#
# Verify the whole tunnel setup before trusting it, without seeding anything:
#   torrentd --config /etc/torrentd/torrentd.toml vpn check
# network_kill_switch = false

# ---------------------------------------------------------------------------
# Profiles — at least one is required
# ---------------------------------------------------------------------------
# Everything below this line belongs to a `[[profile]]` table. TOML binds a
# key written after a `[[table]]` header to that table, so a daemon-wide key
# added down here is rejected as an unknown `[[profile]]` field — put it in
# the "Daemon-wide" block above.
# A profile is one libtorrent session with its own network posture, identity
# and directories. There is no default profile and no implicit one: every
# profile states how it reaches the network, because the alternative —
# defaulting to the host's own interfaces with DHT on — is the least private
# posture the daemon has, and it should not be what you get by writing
# nothing.
#
# `POST /api/torrents` therefore always requires `profile_id`.
#
#   network = "host"  binds the host's own interfaces. Peers and trackers see
#                     this machine's address. Right for public trackers and DHT
#                     content, and for nothing that must not be traced here.
#
#   network = "vpn"   binds a tunnel. Every socket in the profile is
#                     source-bound to the tunnel address, and DHT, PEX and LSD
#                     are disabled unconditionally — there is no key that turns
#                     them back on.

[[profile]]
id                = "public"
network           = "host"
listen_interfaces = "0.0.0.0:6881,[::]:6881"
# DHT is a public, global announcement of what this host holds. Off unless you
# write it.
dht               = true

# Optional per-profile overrides. Every value below is distinct from every
# other profile's in this file, and has to stay that way: `listen_port` (which
# shares one namespace with the ports in a host profile's
# `listen_interfaces`), `peer_fingerprint_hex` and `user_agent` are all
# refused when two profiles end up with the same one.
# resume_dir           = "/var/lib/torrentd/resume/public"
# torrent_dir          = "/var/lib/torrentd/torrents/public"
# peer_fingerprint_hex = "b7c6d5e4f3a29180"
# user_agent           = "libtorrent/2.0"
# upload_rate_limit    = 0

# ---------------------------------------------------------------------------
# VPN profiles — multi-account private-tracker seeding
# ---------------------------------------------------------------------------
# Private trackers ban permanently for cross-contamination between accounts, so
# each account gets its own profile, its own tunnel, and its own identity.
# `peer_fingerprint_hex` and `user_agent` are required here and must be unique
# across profiles: they are what a tracker sees as the account's client.
#
# `vpn_interface` must equal `vpn_config`'s file name without its extension.
# wg-quick derives one from the other in both directions, so they cannot
# differ.
#
# The eight rules this is built on, and why each exists, are documented on the
# `torrentd-engine::profile` module.
#
# `allowed_tracker_domains` is a *misconfiguration guard* for `.torrent` adds —
# it catches loading one account's torrent into another — not an egress
# control. It is empty by default, which disables the check entirely.

# The port here shares one namespace with the ports `public` binds above, so
# it is 6891 rather than 6881: an announced port that two profiles share is
# what correlates them to a tracker operator, whichever address each announced
# from.
#
# [[profile]]
# id                       = "account_a"
# network                  = "vpn"
# vpn_type                 = "wireguard"
# vpn_config               = "/etc/wireguard/wg-acct-a.conf"
# vpn_interface            = "wg-acct-a"
# listen_port              = 6891
# peer_fingerprint_hex     = "a1b2c3d4e5f60718"
# user_agent               = "qBittorrent/5.0.3"
# resume_dir               = "/var/lib/torrentd/resume/account_a"
# torrent_dir              = "/var/lib/torrentd/torrents/account_a"
# allowed_tracker_domains  = ["tracker.example.com"]
# upload_rate_limit        = 0

# Dynamic port forwarding (ProtonVPN / PIA-style ephemeral ports). Providers
# like these don't give you a static forwarded port: it is negotiated at
# runtime over NAT-PMP against the tunnel gateway, and its ~60s lease is
# renewed continuously. Set `port_forward = "natpmp"`; `listen_port` is then
# omitted, and the negotiated port is surfaced via `GET /api/profiles/<id>`
# (`forwarded_port`) plus the `torrentd_profile_forwarded_port` and
# `torrentd_profile_port_forward_up` metrics.
#
# [[profile]]
# id                       = "proton_a"
# network                  = "vpn"
# vpn_type                 = "wireguard"
# vpn_config               = "/etc/wireguard/proton-a.conf"
# vpn_interface            = "proton-a"
# port_forward             = "natpmp"
# port_forward_gateway     = "10.2.0.1"   # ProtonVPN WireGuard gateway (default)
# peer_fingerprint_hex     = "3c2d1e0f4a5b6c7d"
# user_agent               = "Transmission/4.0.6"
# resume_dir               = "/var/lib/torrentd/resume/proton_a"
# torrent_dir              = "/var/lib/torrentd/torrents/proton_a"
# allowed_tracker_domains  = ["tracker.example.com"]

# A two-account deployment, live and uncommented, is in
# deploy/torrentd.multi-account.sample.toml. Both files are parsed and
# validated by this repository's own test suite, so what ships here is a
# configuration the daemon accepts rather than one that merely reads well.

# ---------------------------------------------------------------------------
# Managed pool (optional)
# ---------------------------------------------------------------------------
# Point torrentd at the directories it should own and at a directory of
# `.torrent` files to match them against. It indexes both and reports, per
# path, what is adopted, matched, partial, missing, orphaned, or claimed by
# two torrents at once — which is what makes a multi-terabyte library legible.
#
# Migrating from another client is not a special mode: set `library_dir` to
# that client's state directory and scan. qBittorrent's BT_backup holds both
# `<hash>.torrent` and `<hash>.fastresume`, and the sidecars are read for their
# save-path, category and tag hints. Copy it somewhere scratch first — scanning
# only reads, but there is no reason to have the other client's live state
# directory open at all.
#
#   torrentd --config /etc/torrentd/torrentd.toml pool scan
#   torrentd --config /etc/torrentd/torrentd.toml pool status
#   torrentd --config /etc/torrentd/torrentd.toml pool orphans
#
# The index schema moves forward one way. The first open on this build
# migrates the torrent→account column from `slot` to `profile`, and a build
# predating that change cannot open the result. The pre-migration database is
# left beside it as `<db_path>.pre-v3.bak` — restore that file to roll back.
# It is the only copy of the `plan` / `plan_step` mutation journal, which a
# rescan does not reconstruct.
#
# [pool]
# roots       = ["/data/torrents"]        # must not nest
# library_dir = "/var/lib/torrentd/library"
# db_path     = "/var/lib/torrentd/pool.db"   # default: alongside resume_dir
# import_legacy_registry = true               # fold an old assignment file in
# max_concurrent_verify  = 4                  # bounded so a bulk adopt cannot
#                                             # starve what is already seeding
#
# **This is the one key that lets torrentd move and delete files inside your
# roots.** Off by default; leave it off until you actually want that. The
# index, matching, adoption and reporting are all read-only without it, and
# every mutation is planned, journaled and re-checked at apply time even with
# it on.
# allow_mutations = false

# ---------------------------------------------------------------------------
# Authentication — required, one way or the other
# ---------------------------------------------------------------------------
# The daemon refuses to start unless you have either configured `[auth]` or
# written `allow_unauthenticated = true`. Without `[auth]` it authenticates
# nothing: every route, including every mutating one, is open to anyone who can
# reach the port. That is a legitimate posture behind a reverse proxy that does
# its own access control — but not one to arrive at by omission, which is what
# it used to be.
#
# The opt-out does not extend to a routable address: `allow_unauthenticated`
# with a non-loopback `http_listen` is refused, because that is an
# unauthenticated mutating API on the network. So the two safe shapes are:
#
#   loopback + allow_unauthenticated   access control is the proxy's job
#   any bind + [auth]                  the daemon authenticates itself
#
# This sample ships the first, because it binds loopback: see
# `allow_unauthenticated` in the daemon-wide block at the top. Configure [auth]
# below and delete that line before exposing the API anywhere.
# Generate the values — never write a password or token here by hand:
#   torrentd --config /etc/torrentd/torrentd.toml hash-password
#   torrentd --config /etc/torrentd/torrentd.toml new-token --name ci --scopes read
#
# Bootstrapping order: `--config` is read before any subcommand runs, so this
# file has to exist and parse first — but `hash-password`, `new-token`, the
# `pool` subcommands and observe-only `vpn check` are exempt from the
# authentication posture check, because they construct no session and bind
# nothing. `vpn check --bring-up` is not: it raises a real tunnel on this host,
# so it takes the daemon's full check. So write this file without `[auth]` and
# with whatever `http_listen` the deployment needs, generate the values, then
# add the section. In a container: `compose run --rm torrentd hash-password`.
# See docs/running.md §6.
#
# The token is printed once and is not stored; only its SHA-256 goes below, so
# a leaked config file cannot be replayed as a credential. The password gets
# Argon2id because a human chose it; a 256-bit token this daemon generated has
# nothing to guess, and Argon2 on every Prometheus scrape would burn ~50ms of
# CPU per request by design.
#
# Scopes: read (safe methods), write (anything that mutates), metrics
# (/metrics and nothing else — keeps a scrape credential out of the API).
# /healthz is never authenticated.
#
# [auth]
# password_hash    = "$argon2id$v=19$m=19456,t=2,p=1$...$..."
# session_ttl_secs = 43200
#
# [[auth.token]]
# name   = "prometheus"
# sha256 = "0870bd54c89de51c..."
# scopes = ["metrics"]
