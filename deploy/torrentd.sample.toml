# Sample torrentd configuration file.
#
# Copy to /etc/torrentd/torrentd.toml and edit. Unknown keys are a fatal
# startup error, in `[[profile]]` tables too, so a typo is caught rather than
# ignored. Every key is documented here; docs/running.md covers the deployment
# around them.

# ---------------------------------------------------------------------------
# Daemon-wide
# ---------------------------------------------------------------------------
default_save_path = "/data/torrents"
resume_dir        = "/var/lib/torrentd/resume"
torrent_dir       = "/var/lib/torrentd/torrents"
http_listen       = "127.0.0.1:8080"   # loopback by default
log_level         = "info"   # error | warn | info | debug (reloadable)

# The daemon refuses to start unless you either configure [auth] (see the
# bottom of this file) or say here that you do not want authentication. This
# sample takes the second option because it binds loopback, where access
# control is the reverse proxy's job. Delete this line and configure [auth]
# before exposing the API anywhere — a non-loopback bind without [auth] is
# refused outright.
#
# Read once, at startup, like [auth], http_listen and trusted_proxies: editing
# any of the four takes effect on restart, not on SIGHUP. A reload after such an
# edit warns "requires daemon restart; ignored" and changes nothing.
allow_unauthenticated = true

# Without [auth], a request whose Host is not loopback (localhost, 127.0.0.0/8,
# [::1]) is refused, so a web page whose name rebinds to 127.0.0.1 cannot read
# the API. A reverse proxy in front of this daemon passes its own name through
# as Host (Caddy does by default; nginx needs `proxy_set_header Host $host;`):
# list that name here. Names or addresses only, no scheme or port. Refused
# beside [auth]. Read once, at startup.
# allowed_hosts = ["torrentd.example.com"]

# Peers whose forwarding headers are believed, as IPs or CIDR blocks. There
# are three such headers and all three are read: X-Forwarded-For,
# X-Forwarded-Proto and RFC 7239 Forwarded. Empty by default, which means no
# forwarding header is ever read and the socket's peer address is the client.
#
# The proxy must strip or overwrite all three before adding its own. That is
# the only requirement torrentd places on it, and it covers Forwarded too, not
# just the two X- names: where an X- name is absent, the client's Forwarded is
# what the daemon reads. `deploy/Caddyfile` is the worked example.
#
# A /0 prefix is refused at startup. It would make every caller a trusted
# proxy, which makes every forwarding header client-controlled.
#
# Set this to the address your reverse proxy connects from, and only that:
# anything listed here can claim to be any client. Two things use it: the
# throttle on `POST /v1/sessions`, which becomes per-client instead of one
# shared bucket, and the `client_ip` field on the login log lines, including
# the one that records a failed attempt.
#
# One address, not a range. `deploy/compose.yaml` pins its `proxy` service to
# 172.28.0.2 on an explicit subnet precisely so a single /32 can be named here;
# a range such as 172.16.0.0/12 would trust every container on every Docker
# network on the host.
#
# Read once, at startup, like [auth], http_listen and allow_unauthenticated:
# the trust set is parsed before anything is served and does not follow a
# running daemon. Editing this key and sending SIGHUP warns "requires daemon
# restart; ignored" and changes nothing — decommission a proxy here and the
# daemon keeps believing its headers until you restart.
#
# torrentd never terminates TLS itself. See deploy/Caddyfile.
# trusted_proxies = ["172.28.0.2"]

# `resume_dir` and `torrent_dir` are roots: each profile gets its own
# subdirectory under them, named after the profile id. A profile may override
# either with an absolute path of its own — which is also how you point a
# profile at directories from a pre-profiles deployment, where resume files
# lived directly under the root.
#
# Optional. Defaults to <resume_dir>/../registry.db, a SQLite database that
# records which profile owns which info-hash. A path ending in .json names an
# older JSON registry, imported once into a .db file beside it.
# registry_path = "/var/lib/torrentd/registry.db"

# libtorrent settings overrides (applied on top of the high_performance_seed
# preset). All optional; omit any to use the preset's default.
connections_limit             = 10000
file_pool_size                = 1000
aio_threads                   = 8
max_concurrent_http_announces = 200
upload_rate_limit             = 0    # bytes/sec; 0 = unlimited
# Omitted, each session runs libtorrent's rate-based choker, which unchokes as
# many peers as the upload rate achieved to them supports. Set it to unchoke a
# fixed number per session instead. Read at startup; a reload reports it.
# unchoke_slots_limit         = 500

# Local Service Discovery announces to the local network segment. It is
# ignored for `network = "vpn"` profiles, which disable it unconditionally.
enable_lsd = false

# Default peer identity for profiles that do not set their own. A `vpn`
# profile must set its own — see below.
#
# These are defaults, not a shared identity: two profiles that both end up
# with the same effective `peer_fingerprint` / `user_agent` — one inheriting
# these, one spelling them out — are refused, because that is one peer-id
# prefix on the wire from two postures.
#
# `peer_fingerprint` is the peer-id prefix itself: exactly 8 printable ASCII
# characters, handed to libtorrent as written. A profile's own
# `peer_fingerprint` below is the same field in the same form and overrides
# this one. libtorrent's own client code is refused: any prefix starting
# "-LT", such as "-LT20E0-", the default of the libtorrent this daemon is
# built on.
#
# The two must agree with each other wherever they are written. A tracker
# reads both, and one client's peer-id prefix beside another client's user
# agent is a client that does not exist. Nothing checks the pairing; take both
# from the one client a profile presents as, as every example in this file
# does ("-qB4630-" is qBittorrent 4.6.3's prefix).
#
# Only the prefix and the strings change: the rest of the peer id, the
# extension handshake and the announce parameters stay libtorrent's. Name a
# client built on libtorrent 2.0, in a version that ships on it — qBittorrent
# or Deluge, as every example here does — never Transmission or rTorrent,
# whose identity a tracker can tell this daemon's wire behaviour from.
# peer_fingerprint = "-qB4630-"
# user_agent       = "qBittorrent/4.6.3"

# Liveness: max age (seconds) of a WireGuard tunnel's latest handshake before
# the health monitor declares the profile down and pauses it. Catches a tunnel
# that keeps its address but has silently stopped handshaking. Default 180.
# vpn_handshake_max_age_secs = 180

# Shutdown: how long (seconds) a stop waits for every torrent's resume data to
# be saved before giving up on what is left. Default 60. The shipped unit's
# TimeoutStopSec=120 is sized to the default; a larger value is covered by the
# EXTEND_TIMEOUT_USEC the daemon sends while it stops, so TimeoutStopSec needs
# raising only for a stop that must fit without those extensions.
# shutdown_drain_secs = 60

# Defence-in-depth kill switch. When true, torrentd installs a fail-closed
# nftables table (`torrentd_ks_<uid>`) confining the daemon's own egress to loopback
# and its vpn profiles' tunnel interfaces — so if a tunnel drops, the kernel
# drops the traffic regardless of libtorrent's socket bind or the 30s monitor.
# Removed cleanly on SIGTERM.
#
# It does NOT put tracker DNS through the tunnel. Lookups go to the host's
# resolver, which asks upstream from the host's own address, so the host's
# upstream resolver sees every tracker hostname the daemon looks up. Under the
# switch only a resolver on loopback is reachable (systemd-resolved's
# 127.0.0.53). To keep lookups inside a tunnel, configure the resolver itself:
# docs/running.md, "Tracker lookups through a tunnel".
#
# Requires `nft`, CAP_NET_ADMIN, at least one `network = "vpn"` profile, no
# `network = "host"` profile (the ruleset would drop its egress while it
# reported itself healthy, so the daemon refuses the mix), and a dedicated
# non-root user: the ruleset matches on the daemon's uid, and as root
# it would drop every root-owned process's traffic on the host, so the daemon
# refuses to start rather than install it. The packaged systemd unit uses
# User=torrentd.
#
# WireGuard profiles only: `openvpn` runs under the daemon's uid, so the
# ruleset would drop its own connection to the provider, and the daemon
# refuses the kill switch beside an OpenVPN profile. The daemon raises each
# profile's link itself with `ip` and `wg` under CAP_NET_ADMIN, as root or not;
# that path runs no PostUp/PreDown hooks and applies no DNS line —
# docs/running.md §11.6.
#
# Verify the whole tunnel setup before trusting it, without seeding anything:
#   torrentd --config /etc/torrentd/torrentd.toml vpn check
# network_kill_switch = false

# ---------------------------------------------------------------------------
# Profiles — at least one is required
# ---------------------------------------------------------------------------
# Everything below this line belongs to a `[[profile]]` table. TOML binds a
# key written after a `[[table]]` header to that table, so a daemon-wide key
# added down here is rejected as an unknown `[[profile]]` field — put it in
# the "Daemon-wide" block above.
# A profile is one libtorrent session with its own network posture, identity
# and directories. There is no default profile and no implicit one: every
# profile states how it reaches the network, because the alternative —
# defaulting to the host's own interfaces with DHT on — is the least private
# posture the daemon has, and it should not be what you get by writing
# nothing.
#
# `POST /v1/torrents` therefore always requires `profile_id`.
#
#   network = "host"  binds the host's own interfaces. Peers and trackers see
#                     this machine's address. Right for public trackers and DHT
#                     content, and for nothing that must not be traced here.
#
#   network = "vpn"   binds a tunnel. Every socket in the profile is
#                     source-bound to the tunnel address, and DHT, PEX and LSD
#                     are disabled unconditionally — there is no key that turns
#                     them back on.

# The wildcard addresses are fine while this is the only profile. Beside a
# `vpn` profile they are refused: libtorrent expands `0.0.0.0` and `[::]` to
# every interface that is up, the tunnels included, and would announce this
# profile from them. Uncommenting one of the vpn profiles below therefore
# means naming the host's own address or device here, such as "eth0:6881".
[[profile]]
id                = "public"
network           = "host"
listen_interfaces = "0.0.0.0:6881,[::]:6881"
# DHT is a public, global announcement of what this host holds. Off unless you
# write it.
dht               = true

# Optional per-profile overrides. Every value below is distinct from every
# other profile's in this file, and has to stay that way. `listen_port` shares
# one namespace with the ports in a host profile's `listen_interfaces`, and two
# profiles that end up on one port are refused. `peer_fingerprint` and
# `user_agent` are refused the same way whenever either of the two profiles
# wrote the value down; two that both omit the key and inherit the default
# above are accepted, which is what makes it a default. `resume_dir` and
# `torrent_dir` must not *equal* another profile's — one containing another's
# is fine, since neither store descends into a subdirectory.
# resume_dir           = "/var/lib/torrentd/resume/public"
# torrent_dir          = "/var/lib/torrentd/torrents/public"
# peer_fingerprint     = "-qB4670-"
# user_agent           = "qBittorrent/4.6.7"
# Per-profile upload cap in bytes/sec, overriding the daemon-wide key above.
# `0` here means *unlimited* for this profile, not "unset": writing it is how
# you uncap one account while the daemon-wide key caps the rest. Omit the key
# entirely to take the daemon-wide value.
# upload_rate_limit    = 0

# ---------------------------------------------------------------------------
# VPN profiles — multi-account private-tracker seeding
# ---------------------------------------------------------------------------
# Private trackers ban permanently for cross-contamination between accounts, so
# each account gets its own profile, its own tunnel, and its own identity.
# `peer_fingerprint` and `user_agent` are required here and must be unique
# across profiles: they are what a tracker sees as the account's client.
# `peer_fingerprint` takes the same 8-character raw form as the top-level key.
# The older `peer_fingerprint_hex` key is no longer read, and a profile that
# still sets it is refused at load: its sixteen hex characters were never
# decoded, so they did not reach the wire as the prefix they spelled.
#
# A wireguard profile's `vpn_config` must be
# /etc/wireguard/<vpn_interface>.conf — the file root's `wg-quick up <iface>`
# reads, so a link raised before the daemon starts is adopted against the same
# key. The daemon itself never runs wg-quick. Anything else is refused at
# startup.
#
# The eight rules this is built on, and why each exists, are documented on the
# `torrentd-engine::profile` module.
#
# `allowed_tracker_domains` is the account-isolation guard, and a vpn profile
# must set it: the domains of the trackers this account belongs to. Every
# torrent the profile takes — added over the API, adopted from the pool, or
# found at startup in its resume or `.torrent` directory — must announce only
# to trackers on those domains or their subdomains, and to at least one. One
# tracker outside the list refuses the torrent, whatever else it announces
# to; a resume file's own tracker list is what is checked where it has one.
# It keeps one account's torrent, and its passkey, from being announced from
# another account's tunnel. It is not an egress control. A host profile may
# set it too, and is not checked when it does not.

# The port here shares one namespace with the ports `public` binds above, so
# it is 6891 rather than 6881: an announced port that two profiles share is
# what correlates them to a tracker operator, whichever address each announced
# from.
#
# The address a tracker sees is the tunnel's exit, not its own address, and a
# shared exit correlates two accounts as surely as a shared port: give each
# vpn profile a WireGuard config for a different server (its `[Peer]`
# `Endpoint`). Startup warns, naming the profiles, when two configs name the
# same Endpoint host. See "Account isolation" in docs/running.md.
#
# [[profile]]
# id                       = "account_a"
# network                  = "vpn"
# vpn_type                 = "wireguard"
# vpn_config               = "/etc/wireguard/wg-acct-a.conf"
# vpn_interface            = "wg-acct-a"
# listen_port              = 6891
# peer_fingerprint         = "-qB5030-"
# user_agent               = "qBittorrent/5.0.3"
# resume_dir               = "/var/lib/torrentd/resume/account_a"
# torrent_dir              = "/var/lib/torrentd/torrents/account_a"
# allowed_tracker_domains  = ["tracker.example.com"]
# `0` means unlimited for this profile, overriding the daemon-wide cap; omit
# the key to inherit it.
# upload_rate_limit        = 0

# Dynamic port forwarding (ProtonVPN / PIA-style ephemeral ports). Providers
# like these don't give you a static forwarded port: it is negotiated at
# runtime over NAT-PMP against the tunnel gateway, and its ~60s lease is
# renewed continuously. Set `port_forward = "natpmp"`; `listen_port` is then
# omitted, and the negotiated port is surfaced via `GET /v1/profiles/<id>`
# (`forwarded_port`) plus the `torrentd_profile_forwarded_port` and
# `torrentd_profile_port_forward_up` metrics.
#
# [[profile]]
# id                       = "proton_a"
# network                  = "vpn"
# vpn_type                 = "wireguard"
# vpn_config               = "/etc/wireguard/proton-a.conf"
# vpn_interface            = "proton-a"
# port_forward             = "natpmp"
# port_forward_gateway     = "10.2.0.1"   # ProtonVPN WireGuard gateway (default)
# peer_fingerprint         = "-DE211s-"
# user_agent               = "Deluge/2.1.1 libtorrent/2.0.14.0"
# resume_dir               = "/var/lib/torrentd/resume/proton_a"
# torrent_dir              = "/var/lib/torrentd/torrents/proton_a"
# allowed_tracker_domains  = ["tracker.example.com"]

# A two-account deployment, live and uncommented, is in
# deploy/torrentd.multi-account.sample.toml. Both files are parsed and
# validated by this repository's own test suite, so what ships here is a
# configuration the daemon accepts rather than one that merely reads well.

# ---------------------------------------------------------------------------
# Managed pool (optional)
# ---------------------------------------------------------------------------
# Point torrentd at the directories it should own and at a directory of
# `.torrent` files to match them against. It indexes both and reports, per
# path, what is adopted, matched, partial, missing, orphaned, or claimed by
# two torrents at once — which is what makes a multi-terabyte library legible.
#
# Migrating from another client is not a special mode: set `library_dir` to
# that client's state directory and scan. qBittorrent's BT_backup holds both
# `<hash>.torrent` and `<hash>.fastresume`, and the sidecars are read for their
# save-path, category and tag hints. Copy it somewhere scratch first — scanning
# only reads, but there is no reason to have the other client's live state
# directory open at all.
#
#   torrentd --config /etc/torrentd/torrentd.toml pool scan
#   torrentd --config /etc/torrentd/torrentd.toml pool status
#   torrentd --config /etc/torrentd/torrentd.toml pool orphans
#
# The index schema moves forward one way. The first open on this build
# migrates the torrent→account column from `slot` to `profile`, and a build
# predating that change cannot open the result. The pre-migration database is
# left beside it as `<db_path>.pre-v3.bak`; restoring that file is how you go
# back to a build that predates this change. It is the only copy of the
# `plan` / `plan_step` mutation journal, which a rescan does not reconstruct.
#
# That copy is a full second copy of the index, so the first open needs free
# space equal to the size of `pool.db`. If it cannot be written the migration
# stops, names the backup path and the reason, and leaves the index as it was.
# Nothing deletes it afterwards and nothing ages it out: remove it yourself
# once you would not go back. An existing copy at that path is kept as it is and
# no new one is taken — but only where it really is one: it has to be a pool
# index, at a schema version this build understands, and not this same `pool.db`
# reached through a symlink. Anything else stops the migration instead, because
# keeping it would run the one-way rename with no rollback at all.
#
# A `pool.db` from one of this change's own pre-release builds can carry
# `profile` without v3's indexes, and can report any version from 0 to 3
# depending on which of them wrote it and where it stopped. Such a file is
# recognised whichever it was, because the indexes are checked before the
# version is trusted: where they did not come with the columns — no index on
# `profile`, or the old `torrent_by_slot` name over it — they are put right,
# and the version stamped, in the same transaction. No data moves; the
# `.pre-v3.bak` copy is not a remedy for it, having the same contents.
#
# [pool]
# roots       = ["/data/torrents"]        # must not nest
# library_dir = "/var/lib/torrentd/library"
# db_path     = "/var/lib/torrentd/pool.db"   # default: alongside resume_dir
# import_legacy_registry = true               # fold an old assignment file in
# max_concurrent_verify  = 4                  # bounded so a bulk adopt cannot
#                                             # starve what is already seeding
#
# **This is the one key that lets torrentd move and delete files inside your
# roots.** Off by default; leave it off until you actually want that. The
# index, matching, adoption and reporting are all read-only without it, and
# every mutation is planned, journaled and re-checked at apply time even with
# it on.
# allow_mutations = false

# ---------------------------------------------------------------------------
# Authentication — required, one way or the other
# ---------------------------------------------------------------------------
# The daemon refuses to start unless you have either configured `[auth]` or
# written `allow_unauthenticated = true`. Without `[auth]` it authenticates
# nothing: every route, including every mutating one, is open to anyone who can
# reach the port. That is a legitimate posture behind a reverse proxy that does
# its own access control — but not one to arrive at by omission, which is what
# it used to be.
#
# The opt-out does not extend to a routable address: `allow_unauthenticated`
# with a non-loopback `http_listen` is refused, because that is an
# unauthenticated mutating API on the network. So the two safe shapes are:
#
#   loopback + allow_unauthenticated   access control is the proxy's job
#   any bind + [auth]                  the daemon authenticates itself
#
# This sample ships the first, because it binds loopback: see
# `allow_unauthenticated` in the daemon-wide block at the top. Configure [auth]
# below and delete that line before exposing the API anywhere.
# Generate the values — never write a password or token here by hand:
#   torrentd --config /etc/torrentd/torrentd.toml hash-password
#   torrentd --config /etc/torrentd/torrentd.toml new-token --name ci --scopes read
#
# Bootstrapping order: `--config` is read before any subcommand runs, so this
# file has to exist and parse first — but `hash-password`, `new-token`, the
# `pool` subcommands and observe-only `vpn check` are exempt from the
# authentication posture check, because they construct no session and bind
# nothing. `vpn check --bring-up` is not: it raises a real tunnel on this host,
# so it takes the daemon's full check. So write this file without `[auth]` and
# with whatever `http_listen` the deployment needs, generate the values, then
# add the section. In a container: `compose run --rm torrentd hash-password`.
# See docs/running.md §6.
#
# The token is printed once and is not stored; only its SHA-256 goes below, so
# a leaked config file cannot be replayed as a credential. The password gets
# Argon2id because a human chose it; a 256-bit token this daemon generated has
# nothing to guess, and Argon2 on every Prometheus scrape would burn ~50ms of
# CPU per request by design.
#
# Scopes: read (safe methods), write (anything that mutates), metrics
# (/metrics and nothing else — keeps a scrape credential out of the API).
# /healthz is never authenticated.
#
# session_ttl_secs is how long a session token from POST /v1/sessions lasts:
# default 43200 (12 hours), and between 60 and 2592000 (30 days) inclusive.
# The daemon refuses to start with a value outside that range.
#
# [auth]
# password_hash    = "$argon2id$v=19$m=19456,t=2,p=1$...$..."
# session_ttl_secs = 43200
#
# [[auth.token]]
# name   = "prometheus"
# sha256 = "0870bd54c89de51c..."
# scopes = ["metrics"]
