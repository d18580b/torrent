apiVersion: v1
kind: Service
metadata:
  name: {{ include "torrentd.fullname" . }}
  labels:
    {{- include "torrentd.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "torrentd.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
{{- if and (eq .Values.peers.expose "loadBalancer") .Values.peers.ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-peers" (include "torrentd.fullname" .) }}
  labels:
    {{- include "torrentd.labels" . | nindent 4 }}
    app.kubernetes.io/component: peers
  {{- with .Values.peers.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  # Local: the node delivers a peer's connection to the pod with the peer's
  # own address, instead of rewriting it to the node's.
  externalTrafficPolicy: Local
  {{- with .Values.peers.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.peers.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector:
    {{- include "torrentd.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.peers.ports }}
    - name: {{ printf "%s-tcp" .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
      protocol: TCP
    - name: {{ printf "%s-udp" .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
      protocol: UDP
    {{- end }}
{{- end }}
