{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.hosts is empty: an Ingress with no rule routes nothing to the API" }}
{{- end }}
{{- $fullname := include "torrentd.fullname" . }}
{{- $traefik := and (eq .Values.ingress.className "traefik") .Values.ingress.maxBodyBytes }}
{{- if $traefik }}
# deploy/Caddyfile's request_body max_size: Traefik buffers the body and
# answers 413 past the cap.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ printf "%s-body-limit" $fullname }}
  labels:
    {{- include "torrentd.labels" . | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ int64 .Values.ingress.maxBodyBytes }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "torrentd.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations $traefik (and (eq .Values.ingress.className "nginx") .Values.ingress.maxBodyBytes) }}
  annotations:
    {{- if and (eq .Values.ingress.className "nginx") .Values.ingress.maxBodyBytes }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ int64 .Values.ingress.maxBodyBytes | toString | quote }}
    {{- end }}
    {{- if $traefik }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-body-limit@kubernetescrd" .Release.Namespace $fullname | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
    {{- end }}
{{- end }}
