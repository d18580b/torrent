{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "torrentd.configSecretName" . }}
  labels:
    {{- include "torrentd.labels" . | nindent 4 }}
type: Opaque
stringData:
  torrentd.toml: |
    {{- include "torrentd.configToml" . | nindent 4 }}
{{- end }}
