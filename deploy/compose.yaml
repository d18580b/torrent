# torrentd behind Caddy. Bringing it up, in order (docs/running.md §8, "On
# the compose stack", has each step and why):
#
#   1. cp deploy/torrentd.sample.toml deploy/torrentd.toml, then in it set
#      http_listen = "0.0.0.0:8080", uncomment trusted_proxies = ["172.28.0.2"]
#      and delete allow_unauthenticated. The file must exist before any
#      `compose run`: a bind mount of a missing file mounts a directory.
#   2. In deploy/Caddyfile, replace torrentd.example.com with your host name.
#   3. Create /data/torrents owned by uid 1000 (docs/running.md §4).
#   4. podman compose -f deploy/compose.yaml build
#      podman compose -f deploy/compose.yaml run --rm torrentd hash-password
#      and paste the hash into an [auth] section of deploy/torrentd.toml.
#   5. podman compose -f deploy/compose.yaml up -d
#
# `docker compose` takes the same arguments.

services:
  torrentd:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    image: torrentd:latest
    restart: unless-stopped
    # A tini-style init as PID 1: it forwards SIGTERM to the daemon and reaps
    # the `ip`/`wg`/`nft` children it execs. Without it the daemon is PID 1,
    # which the kernel shields from signals it installed no handler for, and
    # nothing reaps an orphaned child.
    init: true
    # How long `stop` waits between SIGTERM and SIGKILL. The default is 10s;
    # a graceful shutdown flushes resume data for every torrent and removes
    # the kill switch, which at tens of thousands of torrents takes longer.
    # A SIGKILL mid-drain leaves resume saves unwritten
    # (torrentd_last_shutdown_unsaved_resumes on the next boot), and with the
    # kill switch on, the nftables table installed.
    stop_grace_period: 180s
    # Only a `network = "vpn"` profile needs these: bringing up WireGuard
    # tunnels, and installing the nftables table when
    # network_kill_switch = true. Granted by default is granted to deployments
    # that do not need it, so uncomment them when you add a vpn profile —
    # together with `user: "0:0"` below. The image runs as `USER 1000:1000`,
    # and `cap_add` only fills the container's bounding and permitted sets: a
    # non-root uid with no ambient and no file capabilities gets nothing
    # effective from it, so the tunnel still fails with EPERM.
    #
    # **A vpn profile and `network_kill_switch = true` cannot be combined in
    # this container.** The two requirements exclude each other:
    #
    # - the tunnel needs CAP_NET_ADMIN *effective*, which a compose file can
    #   only deliver by running as root (`user: "0:0"`), for the reason above;
    # - the kill switch matches the daemon's traffic by uid and refuses uid 0,
    #   because `meta skuid 0 drop` would drop every other root-owned socket in
    #   the namespace (`vpn::killswitch::refusal_for_uid`).
    #
    # Neither half is fixable here: compose has no key that raises an ambient
    # capability for a non-root user. Run a vpn profile in this container
    # without the kill switch, or run the daemon from deploy/torrentd.service,
    # which grants CAP_NET_ADMIN to its own non-root user with
    # `AmbientCapabilities=` and supports both together.
    # user: "0:0"
    # cap_add:
    #   - NET_ADMIN
    # devices:
    #   - /dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "2"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
      # The API is NOT published to the host. `proxy` reaches it over the
      # compose network, which is the only thing that should. Inside the
      # container the daemon binds 0.0.0.0:8080 — the one place the sample
      # config cannot be copied verbatim — and a non-loopback bind requires
      # [auth], which is exactly the posture this stack is in.
      #
      # So torrentd.toml must set the key explicitly:
      #
      #     http_listen = "0.0.0.0:8080"
      #
      # Say it even though loopback is the default, because here the default
      # fails quietly. `http_listen` has a serde default, so omitting it is no
      # longer a parse error — the daemon starts, binds 127.0.0.1 *inside* the
      # namespace, and `proxy` reaches nothing. The Containerfile's
      # HEALTHCHECK curls localhost:8080 from inside the same namespace, so it
      # succeeds and the container reports healthy while the API is
      # unreachable from `proxy`. Re-aiming the health check does not recover
      # the signal: it passes either way.
    networks:
      - front
    volumes:
      - ./torrentd.toml:/etc/torrentd/torrentd.toml:ro
      # The state directory itself, not only the two stores inside it. The
      # daemon keeps its state beside resume_dir: the assignment registry
      # (registry.db), the pool index (pool.db), each profile's
      # DHT state (session_state-<id>.dat), last_shutdown.json and the
      # single-instance lock. Mounting only resume/ and torrents/ left those in
      # the container layer, so a rebuild or `compose up --force-recreate` lost
      # which torrent belongs to which account — the record the cross-profile
      # uniqueness rule is enforced from — and the pool index with it.
      #
      # resume/ and torrents/ keep their own volumes, nested inside this one,
      # so a deployment upgrading from the two-volume layout keeps its data.
      - torrentd-state:/var/lib/torrentd
      - torrentd-resume:/var/lib/torrentd/resume
      - torrentd-torrents:/var/lib/torrentd/torrents
      # Only needed by a `network = "vpn"` profile.
      # - /etc/wireguard:/etc/wireguard:ro
      # The payload directory. Read-write: it is the sample config's
      # default_save_path, so every add without its own save_path lands
      # here, and with
      # [pool] allow_mutations on and it listed in roots, plan applies move
      # files inside it and delete_files moves them to <root>/.torrentd-trash.
      # Mounted :ro, each of those fails with EROFS. deploy/torrentd.service grants the same path
      # in ReadWritePaths.
      # The host directory must be writable by uid 1000 before the first `up`;
      # docs/running.md §4 gives the commands, rootless podman included.
      - /data/torrents:/data/torrents

  # torrentd does not terminate TLS, by design: an HTTP server's TLS
  # configuration is a thing to get wrong, and there is a mature one right
  # here. Caddy terminates it and forwards the API.
  #
  # The forwarding headers below are the contract, and `trusted_proxies` in
  # torrentd.toml has to name the address this service connects from. Compose
  # assigns that address from the bridge subnet and changes it across
  # down/up, and `trusted_proxies` takes IPs and CIDRs rather than service
  # names, so the address is pinned here instead: 172.28.0.2, which is what
  # the sample config lists as a single /32. Widening it to the whole subnet
  # would make every sibling container on the host a trusted proxy, and a
  # trusted proxy can claim to be any client. What getting it wrong costs is in
  # docs/running.md §6a.
  proxy:
    # Pinned by the digest of its multi-arch index, as deploy/Containerfile's
    # base images are: `2-alpine` is a moving tag, and this is the process
    # that terminates TLS and holds the certificates. Move the pin with
    #   skopeo inspect --raw docker://docker.io/library/caddy:2-alpine | sha256sum
    image: docker.io/library/caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    depends_on:
      - torrentd
    ports:
      - "80:80"
      - "443:443"
    networks:
      front:
        ipv4_address: 172.28.0.2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

# An explicit subnet, because the one value `trusted_proxies` can hold is a
# fixed address and compose will not hand out a stable one otherwise. Change
# the subnet if 172.28.0.0/24 collides with something on your host, and change
# `proxy`'s address and torrentd.toml's `trusted_proxies` with it.
#
# `ip_range` is what keeps the pin usable. Dynamic allocation hands out the
# lowest free address in the pool, and `torrentd` is unpinned on this network
# and created *first* — `proxy` declares `depends_on: [torrentd]` — so without
# a confined range it takes 172.28.0.2 before `proxy` asks for it and the
# stack fails to come up with that address already in use. So the bottom half
# is reserved and nothing dynamic lands in it: .1 is the gateway, .2 is
# `proxy`, .3-.127 are spare for anything else this file pins by hand, and
# every unpinned service is allocated from 172.28.0.128/25.
networks:
  front:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25

volumes:
  torrentd-state:
  torrentd-resume:
  torrentd-torrents:
  caddy-data:
  caddy-config:
