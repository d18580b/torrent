services:
  torrentd:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    image: torrentd:latest
    restart: unless-stopped
    # A `vpn` profile brings up its own WireGuard tunnel (and, with
    # network_kill_switch = true, installs an nftables table). A deployment
    # whose profiles are all `network = "host"` needs neither: remove the
    # cap_add + devices stanzas in that case.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "2"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
      - "127.0.0.1:8080:8080"   # HTTP API — bind to localhost; front
                                # with reverse proxy for remote access.
    volumes:
      - ./torrentd.toml:/etc/torrentd/torrentd.toml:ro
      - torrentd-resume:/var/lib/torrentd/resume
      - torrentd-torrents:/var/lib/torrentd/torrents
      - /etc/wireguard:/etc/wireguard:ro
      # Operator places the actual data here; torrentd reads only.
      - /data/torrents:/data/torrents:ro

volumes:
  torrentd-resume:
  torrentd-torrents:
