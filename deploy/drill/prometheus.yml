# Prometheus for the alert drill: scrape and evaluate every 5 s so a fault
# becomes an alert in seconds rather than minutes.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/torrentd.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: torrentd
    # /metrics needs a token with the `metrics` scope; run.sh mints it.
    authorization:
      credentials_file: /etc/prometheus/metrics.token
    static_configs:
      - targets: ["torrentd:8080"]
