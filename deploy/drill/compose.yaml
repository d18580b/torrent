# Alert-delivery drill: torrentd, Prometheus with deploy/prometheus's rules,
# Alertmanager, and a webhook sink that records what it is sent.
#
# Not a deployment, and the daemon here is neither a release's nor the
# published ghcr.io image's: it is built locally with the fault-injection
# feature, which adds POST /v1/faults, and runs only
# because the service below sets TORRENTD_FAULT_INJECTION=1. run.sh writes
# the daemon's config and faults into $DRILL_DIR, brings this up, injects
# faults through the daemon's own API, and asserts each matching alert arrives
# at the sink:
#
#   deploy/drill/run.sh
#
# Every port is published on loopback only, for run.sh to reach.
#
# Each image is pinned by the digest of its multi-arch index, not by its tag
# alone, so the drill runs the same binaries every time. Move a pin with
#   skopeo inspect --raw docker://IMAGE:TAG | sha256sum
# The Prometheus line is also the one definition of the Prometheus release
# `mise run test-alerts` runs promtool from: that task reads it from here, so
# the rules are unit-tested by the binary that evaluates them in the drill.
name: torrentd-drill

services:
  torrentd:
    image: ${TORRENTD_IMAGE:-localhost/torrentd:drill}
    build:
      context: ../..
      dockerfile: deploy/Containerfile
      # The fault-injection build: real sessions, plus POST /v1/faults for
      # the faults nothing outside the process can cause. Never a release.
      args:
        CARGO_FEATURES: torrentd/fault-injection
    environment:
      # A fault-injection build exits 78 at startup without this: the opt-in
      # that keeps one which reached a real host from running there.
      TORRENTD_FAULT_INJECTION: "1"
    volumes:
      # Rewritten in place by run.sh to make a reload fail, so a file mount
      # rather than :ro.
      - ${DRILL_DIR:?run through run.sh}/torrentd.toml:/etc/torrentd/torrentd.toml:z
      # Holds a .torrent that is not one, which the boot scan fails to load.
      - ${DRILL_DIR:?run through run.sh}/torrents:/drill/torrents:ro,z
      # The resume store, on the host so run.sh can put a directory where
      # one resume file's temporary file goes, and that write fails.
      - ${DRILL_DIR:?run through run.sh}/resume:/drill/resume:z
      - state:/var/lib/torrentd
    ports:
      - "127.0.0.1:18180:8080"

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ../prometheus/torrentd.rules.yml:/etc/prometheus/torrentd.rules.yml:ro,z
      - ${DRILL_DIR:?run through run.sh}/metrics.token:/etc/prometheus/metrics.token:ro,z
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      - torrentd
      - alertmanager

  alertmanager:
    image: docker.io/prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
    depends_on:
      - sink

  sink:
    image: docker.io/library/python:3.12-alpine@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d
    command: ["python", "-u", "/sink.py"]
    volumes:
      - ./sink.py:/sink.py:ro,z
    ports:
      - "127.0.0.1:19095:9095"

volumes:
  state:
