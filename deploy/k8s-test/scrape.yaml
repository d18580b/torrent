# What the chart's ServiceMonitor asks Prometheus to do, done once by a pod in
# the `monitoring` namespace (networkPolicy.prometheusNamespaces' default):
# GET /metrics on the release's API Service, port `http`, with the metrics
# token from a Secret. The cluster has no Prometheus Operator, so this is the
# scrape without the operator. run.sh applies it with @RELEASE@, @NAMESPACE@
# and @IMAGE@ replaced; the image under test carries the curl this runs.
#
# It prints the status an unauthenticated scrape gets, then the authenticated
# scrape's body, and fails where the authenticated scrape fails.
#
# k3s enforces the chart's NetworkPolicy with kube-router, which admits a new
# pod's address only once its policy sync has run: until then this pod's
# connections to the API port are rejected, and curl sees connection refused
# within a millisecond of the pod starting. Each curl retries a refused
# connection for up to 60 s, as Prometheus would at its next interval; a
# policy that never admits the monitoring namespace still fails the scrape.
apiVersion: v1
kind: Pod
metadata:
  name: scrape-@RELEASE@
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  containers:
    - name: scrape
      image: "@IMAGE@"
      imagePullPolicy: Never
      command: [/bin/bash, -c]
      args:
        - |
          set -euo pipefail
          url=http://@RELEASE@-torrentd.@NAMESPACE@.svc:8080/metrics
          retry=(--retry 60 --retry-delay 1 --retry-max-time 60 --retry-connrefused)
          printf 'unauthenticated %s\n' "$(curl -sS "${retry[@]}" -o /dev/null -w '%{http_code}' --max-time 10 "$url")"
          curl -fsS "${retry[@]}" --max-time 10 -H "Authorization: Bearer $TOKEN" "$url"
      env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: torrentd-metrics-token
              key: token
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
