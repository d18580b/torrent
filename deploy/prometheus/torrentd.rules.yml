# Alert rules for torrentd. Every series read here is in ../metrics.md, and
# every alert has a fixture in torrentd.rules.test.yml:
#
#   promtool test rules deploy/prometheus/torrentd.rules.test.yml
#   mise run test-alerts      # the same, in a container
#
# Severity:
#   critical  seeding has stopped, or a safety guarantee no longer holds
#   warning   something failed and an operator should look
#   info      worth knowing; routine on some trackers
#
# `increase(x[15m]) > 0` fires on the first evaluation after an event and
# resolves 15 minutes after the last one. It needs a scraped sample from
# before the event. The daemon writes every series these read at zero at
# boot, but nothing can scrape it until /metrics is served, after the boot
# scans and the alert loop's first stretch: whatever those count is already in
# the first sample, and a zero nobody scraped is no sample. So for each counter
# a boot moves, the daemon also exports what it had counted at the first
# scrape as a `torrentd_boot_*` gauge, and the rule fires on that being above
# zero too (`or torrentd_boot_x > 0`). Such an alert holds for the life of the
# process, as TorrentdBootLoadFailures does; a restart clears it. A series
# that appears only with its first event is matched on its appearance as well
# (`or (x unless x offset 15m)`).

groups:
  - name: torrentd_runtime
    rules:
      # ---- the daemon itself -------------------------------------------
      - alert: TorrentdDown
        expr: up{job="torrentd"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "torrentd on {{ $labels.instance }} is not answering scrapes"

      - alert: TorrentdAlertLoopStalled
        expr: torrentd_alert_loop_heartbeat_age_seconds > 15
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The alert loop has not advanced for {{ $value }}s; seeding, resume saves and status updates have stopped"

      - alert: TorrentdTaskDown
        expr: torrentd_task_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Background task {{ $labels.task }} has exited or panicked; what it watched is no longer watched"

      - alert: TorrentdMetricsDropped
        expr: increase(torrentd_metrics_dropped_samples_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The exporter dropped samples ({{ $labels.reason }}); some series are missing or stale"

      - alert: TorrentdUnready
        # The `no_sessions` and `all_profiles_fenced` cases of /healthz's 503,
        # from the scrape rather than a probe: every configured profile either
        # got no session at boot or is a vpn profile whose tunnel is down. A
        # host profile is never fenced, so one live host profile keeps this
        # quiet, as it keeps /healthz at 200. The third 503, a stalled alert
        # loop, is TorrentdAlertLoopStalled.
        expr: |
          count by (instance, job) (torrentd_profile_boot_failed)
            unless on (instance, job)
          count by (instance, job) (
            torrentd_profile_boot_failed == 0
              unless on (instance, job, profile_id) (torrentd_profile_vpn_tunnel_up == 0)
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Every profile failed at boot or is fenced; the daemon is seeding nothing and /healthz answers 503"

      # ---- profiles and tunnels ----------------------------------------
      - alert: TorrentdProfileBootFailed
        expr: torrentd_profile_boot_failed == 1
        labels:
          severity: critical
        annotations:
          summary: "Profile {{ $labels.profile_id }} got no session at boot and is not seeding"

      - alert: TorrentdVpnTunnelDown
        expr: torrentd_profile_vpn_tunnel_up == 0
        labels:
          severity: critical
        annotations:
          summary: "Profile {{ $labels.profile_id }}'s tunnel is down; its torrents are fenced until the daemon restarts"

      - alert: TorrentdFencePauseFailed
        expr: increase(torrentd_profile_fence_pause_errors_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Fencing profile {{ $labels.profile_id }} failed to pause some torrents; they may still be seeding without the tunnel"

      - alert: TorrentdHandshakeProbeUnavailable
        expr: torrentd_profile_vpn_handshake_probe_ok == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The WireGuard handshake probe cannot run for {{ $labels.profile_id }} (wg missing or unprivileged); only IP presence is checked"

      - alert: TorrentdRouteProbeUnavailable
        # While the route probe cannot run (ip missing, denied, or timing out,
        # or the address probe failing so it is never asked) route loss is not
        # detected, and a route change that sends the tunnel's traffic out the
        # host route never fences the profile.
        expr: torrentd_profile_vpn_route_probe_ok == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The route probe cannot run for {{ $labels.profile_id }}; the tunnel's routing is not being checked, so route loss will not fence it"

      - alert: TorrentdHandshakeAgeRising
        # The trend before the fence. WireGuard re-handshakes every two
        # minutes while traffic flows, so a healthy tunnel's handshake age is
        # a sawtooth averaging about a minute. An average past 90s over half
        # an hour means handshakes are repeatedly late — a provider endpoint
        # dropping initiations, or a path losing UDP — while each one still
        # lands inside vpn_handshake_max_age_secs, so nothing has fenced yet.
        # A stale handshake that does fence is TorrentdVpnTunnelDown.
        # WireGuard handshakes only when it has a packet to send, so an idle
        # profile's age rises without end while the tunnel stays healthy and
        # unfenced. The resets() term asks that a handshake has landed in the
        # last 10 minutes: a profile that stops carrying traffic drops out of
        # the alert before its `for` elapses, rather than firing for as long
        # as it stays idle.
        expr: |
          avg_over_time(torrentd_profile_vpn_handshake_age_seconds[30m]) > 90
            and resets(torrentd_profile_vpn_handshake_age_seconds[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Profile {{ $labels.profile_id }}'s WireGuard handshakes have averaged {{ $value | printf \"%.0f\" }}s old over 30 minutes; a healthy tunnel re-handshakes every 2 minutes"

      - alert: TorrentdPortForwardDown
        expr: torrentd_profile_port_forward_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Profile {{ $labels.profile_id }} holds no NAT-PMP lease; incoming connections are not forwarded"

      - alert: TorrentdPortForwardRenewFailed
        # Provider side: the gateway did not answer or refused the lease. The
        # renewal is retried within seconds and one failure leaves the lease
        # standing, so this is information; a lease actually lost is
        # TorrentdPortForwardDown.
        expr: increase(torrentd_profile_port_forward_failures_total{stage="renew"}[15m]) > 0
        labels:
          severity: info
        annotations:
          summary: "The NAT-PMP gateway did not renew profile {{ $labels.profile_id }}'s lease; a provider-side problem, retried in seconds"

      - alert: TorrentdPortForwardRebindFailed
        # Local side: the gateway named a new port and the session could not
        # be rebound to it, so the session still listens on the old port.
        expr: increase(torrentd_profile_port_forward_failures_total{stage="rebind"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Profile {{ $labels.profile_id }}'s session could not be rebound to the port the gateway forwarded; it still listens on the old one"

      - alert: TorrentdListenFailed
        expr: torrentd_listen_failure_active == 1
        labels:
          severity: critical
        annotations:
          summary: "Profile {{ $labels.profile_id }}'s listen socket failed; it accepts no incoming connections"

      # ---- kill switch -------------------------------------------------
      - alert: TorrentdKillSwitchOff
        # Every profile is vpn-backed, which is the only shape the daemon
        # accepts the kill switch for, and it is not installed. Off is the
        # default and a deliberate choice for an OpenVPN profile, which the
        # kill switch refuses and these series cannot tell apart, so this is
        # information rather than a page: silence it where off is intended.
        expr: |
          torrentd_kill_switch_active == 0
            and on (instance, job)
          (
            count by (instance, job) (torrentd_profile_vpn_tunnel_up)
              == on (instance, job)
            count by (instance, job) (torrentd_profile_boot_failed)
          )
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Every profile is vpn-backed but the nftables kill switch is off; the backstop confining egress to the tunnels is not installed"

      - alert: TorrentdKillSwitchGone
        expr: torrentd_kill_switch_active == 1 and torrentd_kill_switch_table_present == 0
        labels:
          severity: critical
        annotations:
          summary: "The nftables kill switch table is missing or no longer matches the rendered ruleset; the daemon's egress may no longer be confined to the tunnels"

      # A loss the watch's reinstall repairs is over within one check, so
      # TorrentdKillSwitchGone never sees it: the counter is its only trace.
      # Each one left the daemon's egress unconfined for up to a check
      # interval and fenced every vpn profile meanwhile.
      - alert: TorrentdKillSwitchLost
        expr: increase(torrentd_kill_switch_lost_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A runtime check found the nftables kill switch table missing or drifted in the last hour; the daemon's egress was unconfined until it was reinstalled (outcome reinstalled) or still is (outcome lost). Look for what flushes the ruleset"

      - alert: TorrentdKillSwitchUnverifiable
        expr: increase(torrentd_kill_switch_probe_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The daemon's kill switch check could not run (nft could not list the nftables tables or the kill switch's table as JSON, its output could not be read, or the check task itself panicked or was cancelled), so it cannot confirm the kill switch is installed"

      - alert: TorrentdKillSwitchLeftInstalled
        expr: torrentd_last_shutdown_kill_switch_removal_failed == 1
        labels:
          severity: warning
        annotations:
          summary: "The previous run could not remove the kill switch on exit; check `nft list tables`"

      # ---- resume data -------------------------------------------------
      - alert: TorrentdResumeWriteErrors
        expr: increase(torrentd_resume_write_errors_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Resume data for profile {{ $labels.profile_id }} could not be written; a restart loses progress"

      - alert: TorrentdResumeSaveFailures
        expr: >
          increase(torrentd_resume_save_failures_total[15m]) > 0
          or increase(torrentd_resume_save_dispatch_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "save_resume_data is failing for profile {{ $labels.profile_id }}"

      - alert: TorrentdShutdownLeftResumeUnsaved
        expr: torrentd_last_shutdown_unsaved_resumes > 0
        labels:
          severity: warning
        annotations:
          summary: "The previous shutdown left {{ $value }} resume saves unsaved; those torrents restarted from older state"

      # ---- libtorrent --------------------------------------------------
      # Not only a slow alert loop: a bulk operation that pauses every
      # torrent of a large profile at once (a fence, pause-all, setting it
      # offline or online) raises a tracker alert per torrent within a second
      # or so, more than the queue holds. Bulk resumes are paced and do not.
      - alert: TorrentdAlertQueueOverflow
        expr: >
          increase(torrentd_alert_queue_overflows_total[15m]) > 0
          or torrentd_boot_alert_queue_overflows > 0
        labels:
          severity: warning
        annotations:
          summary: "libtorrent dropped alerts for profile {{ $labels.profile_id }}; the alert loop is falling behind, or a fence, pause-all or set online/offline announced every torrent at once"

      - alert: TorrentdTrackerErrors
        # A fraction of announces, not any error: one dead tracker among many
        # torrents fails on every retry forever, while the rest keep replying.
        # This fires only when most announces fail, as in a tracker outage or
        # a tunnel that blocks them. No announces at all divides 0 by 0 and
        # stays silent.
        expr: |
          sum by (profile_id) (increase(torrentd_tracker_alerts_total{kind="error"}[30m]))
            / sum by (profile_id) (increase(torrentd_tracker_alerts_total{kind=~"error|reply"}[30m]))
            > 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Most tracker announces for profile {{ $labels.profile_id }} have been failing for 30 minutes"

      - alert: TorrentdTrackerWarnings
        expr: increase(torrentd_tracker_alerts_total{kind=~"warning|scrape_failed"}[1h]) > 0
        labels:
          severity: info
        annotations:
          summary: "Trackers returned {{ $labels.kind }} for profile {{ $labels.profile_id }}"

      - alert: TorrentdSessionErrors
        expr: >
          increase(torrentd_session_alerts_total{kind=~"portmap_error|udp_error|fastresume_rejected"}[15m]) > 0
          or torrentd_boot_session_alerts > 0
        labels:
          severity: warning
        annotations:
          summary: "libtorrent reported {{ $labels.kind }} for profile {{ $labels.profile_id }}"

      - alert: TorrentdPerformanceWarning
        expr: increase(torrentd_session_alerts_total{kind="performance_warning"}[1h]) > 0
        labels:
          severity: info
        annotations:
          summary: "libtorrent raised a performance warning for profile {{ $labels.profile_id }}; see the journal"

      - alert: TorrentdTorrentErrors
        expr: >
          increase(torrentd_torrent_errors_total[15m]) > 0
          or increase(torrentd_torrent_add_errors_total[15m]) > 0
          or increase(torrentd_storage_move_failures_total[15m]) > 0
          or increase(torrentd_disk_error_retry_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Torrents in profile {{ $labels.profile_id }} are failing"

      - alert: TorrentdDiskErrors
        expr: >
          increase(torrentd_disk_errors_total[15m]) > 0
          or (torrentd_disk_errors_total unless torrentd_disk_errors_total offset 15m)
        labels:
          severity: warning
        annotations:
          summary: "File errors ({{ $labels.op }}) in profile {{ $labels.profile_id }}; the journal names the torrent and file"

      # ---- boot and persistence ----------------------------------------
      - alert: TorrentdBootLoadFailures
        expr: torrentd_boot_torrent_load_failures > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} torrents in profile {{ $labels.profile_id }} failed to load at boot ({{ $labels.source }})"

      - alert: TorrentdUnloadedRegistryTorrents
        expr: torrentd_profile_unloaded_registry_torrents > 0
        labels:
          severity: warning
        annotations:
          summary: "The registry claims {{ $value }} torrents for profile {{ $labels.profile_id }} that no session loaded"

      - alert: TorrentdRegistryErrors
        expr: >
          increase(torrentd_profile_assignment_registry_errors_total[15m]) > 0
          or torrentd_boot_registry_errors > 0
        labels:
          severity: warning
        annotations:
          summary: "Loads or adds for profile {{ $labels.profile_id }} were refused by the assignment registry"

      - alert: TorrentdTorrentPersistFailed
        expr: increase(torrentd_torrent_file_persist_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A .torrent for profile {{ $labels.profile_id }} could not be written ({{ $labels.source }})"

      - alert: TorrentdStoreWriteFailed
        expr: >
          increase(torrentd_store_write_errors_total[15m]) > 0
          or torrentd_boot_store_write_errors > 0
        labels:
          severity: warning
        annotations:
          summary: "A write to the {{ $labels.store }} failed; it no longer matches what the daemon did"

      - alert: TorrentdDirFsyncFailed
        expr: >
          increase(torrentd_dir_fsync_errors_total[15m]) > 0
          or torrentd_boot_dir_fsync_errors > 0
        labels:
          severity: warning
        annotations:
          summary: "A state directory could not be fsynced; renames into it may not survive a power loss (see the log)"

      # ---- control plane -----------------------------------------------
      - alert: TorrentdLoginThrottled
        expr: increase(torrentd_auth_login_failures_total{reason=~"throttled|verification_budget"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Logins are being throttled ({{ $labels.reason }}); someone is guessing passwords"

      - alert: TorrentdLoginFailures
        expr: increase(torrentd_auth_login_failures_total{reason="bad_password"}[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "More than three failed logins in 15 minutes"

      - alert: TorrentdTokenScopeDenied
        expr: increase(torrentd_auth_token_scope_denials_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A valid API token was used for a route outside its scope"

      - alert: TorrentdReloadFailed
        expr: increase(torrentd_config_reload_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A config reload failed at {{ $labels.stage }}; the daemon is running the previous settings"

      # ---- pool --------------------------------------------------------
      - alert: TorrentdPoolPlanFailed
        expr: increase(torrentd_pool_plan_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A pool plan stopped ({{ $labels.kind }}); inspect it before resuming"

      - alert: TorrentdPoolScanErrors
        expr: increase(torrentd_pool_scan_errors_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A pool scan skipped entries ({{ $labels.kind }}); the index may be incomplete"

      - alert: TorrentdPoolVerifyFailed
        expr: increase(torrentd_pool_verify_failed_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Adopted torrents failed verification"

      - alert: TorrentdPoolVerifyStuck
        # Adoptions are waiting and not one has finished, verified or failed,
        # in an hour: the verify queue has stopped draining. A single large
        # torrent can take a while to hash, which is why the window is an
        # hour and not minutes; nothing finishing at all for that long, with
        # work queued behind it, is a wedged queue or a stalled disk.
        #
        # `increase(...[1h]) == 0` alone is also true of a counter younger
        # than an hour, so a large first adoption on a fresh deployment would
        # page after `for:` rather than after an hour. The `offset 1h` term
        # requires the counter to have existed an hour ago, whatever the
        # scrape interval, so the window really spans an hour of history.
        expr: |
          torrentd_pool_verify_queue_depth > 0
            and on (instance, job)
          (
            increase(torrentd_pool_verify_completed_total[1h])
              + on (instance, job)
            increase(torrentd_pool_verify_failed_total[1h])
          ) == 0
            and on (instance, job)
          torrentd_pool_verify_completed_total offset 1h
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} adoptions are queued for verification and none has finished in an hour; the verify queue is not draining"

      - alert: TorrentdPoolIndexDisagrees
        expr: torrentd_pool_index_profile_disagreements > 0
        labels:
          severity: info
        annotations:
          summary: "The pool index and the assignment registry disagree about {{ $value }} torrents; run `torrentd pool scan`"
