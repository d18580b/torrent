name: Release

# Releases are cut by merging the release pull request, from the one branch
# `release-plz-next`; nobody tags or uploads anything by hand, so the only
# signer is this workflow.
#
# On every push to `master`:
#
# 1. `release` runs `release-plz release`, but only for the merge of a pull
#    request from a `release-plz-*` branch of this repository (release-plz.toml's
#    `release_always = false` alone would accept a fork's too). It creates the
#    `vX.Y.Z` tag and a *draft* GitHub release through the API, then replaces
#    the annotated tag object release-plz made, which nobody signed, with a
#    lightweight tag on the merge commit GitHub signed, and checks that
#    GitHub verifies that commit. On any other push it does nothing.
# 2. `release-pr` then runs `release-plz update` and regenerates
#    docs/api/openapi.json (its `info.version` is the crate version) in its
#    checkout, records the result as one verified commit on the pushed
#    commit through the GraphQL API, and moves `release-plz-next` onto it.
#    It opens or updates the release pull request; where GitHub refuses this
#    workflow's token a pull request (an organisation or repository
#    setting), the run stays green and its summary links the comparison to
#    open it from by hand. It dispatches ci.yml and this workflow on the branch, since
#    anything this workflow's token pushes triggers no workflow of its own,
#    and deletes the timestamped `release-plz-*` branches `release-plz
#    release-pr` used to leave behind. With nothing to release it deletes
#    `release-plz-next`, which closes a stale release pull request.
# 3. When `release` created a release, `dist`, `dist-musl` and `image` build
#    everything the release ships, from the tagged commit, with no cache, and
#    `publish` signs and attests the files, uploads them to the draft and
#    publishes it. GitHub's immutable releases freeze a release's assets and
#    tag once it is published, which is why it is created as a draft.
#
# A token-created tag or release triggers no further workflow, so the build
# and publish jobs live here rather than in an `on: release` workflow.
#
# On a pull request that touches the release machinery, and on the dispatch
# `release-pr` makes on `release-plz-next`, the build jobs run without
# uploading or pushing anything, so a broken release build fails that pull
# request or the release pull request rather than the release itself.
#
# Every action is pinned to a commit SHA with its release in a comment, as in
# ci.yml. Each job holds only the permissions it uses; the workflow holds
# none. Expressions reach scripts through `env:`, never pasted into them.

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - .github/workflows/release-plz.yml
      - .github/actions/**
      - release-plz.toml
      - cliff.toml
      - scripts/dist
      - mise.toml
      - deploy/Containerfile
      - rust-toolchain.toml
  # The dry run of the build jobs on the release branch (`release-pr`
  # dispatches it). Nothing is published from a dispatch.
  workflow_dispatch:

permissions: {}

# A newer push to a pull request, or a newer dispatch on a branch, supersedes
# its older dry run. Pushes to `master` are never grouped: a pending run
# cancelled by a later push could be the release pull request's merge, and
# the later push would not release it.
concurrency:
  group: release-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # ci.yml says why this must equal build.rs's default.
  LIBTORRENT_SYS_CACHE_DIR: /home/runner/.cache/torrentd/native

jobs:
  release:
    name: release-plz release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the draft release, both through the API
      pull-requests: read # `release_always = false`: the pull request a commit came from
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          # release-plz reads the tags and the history since the last one.
          fetch-depth: 0
          persist-credentials: false
      # release-plz reads `cargo metadata`, so it needs cargo; mise provides
      # release-plz at the version mise.toml pins.
      - uses: ./.github/actions/setup-rust
      # Tags and releases go through the API, but release-plz works in a
      # scratch copy of the repository on the way, where git wants an
      # identity for anything it records.
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # `release_always = false` makes release-plz release on the merge of any
      # pull request whose head branch starts with `release-plz-`, a fork's
      # included. Only one from this repository's own branches releases.
      - id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "master")
                   | {number, head: .head.ref, repo: .head.repo.full_name}]')
          echo "$prs"
          release=$(jq -r --arg repo "$REPO" \
            'any(.[]; (.head | startswith("release-plz-")) and .repo == $repo)' <<< "$prs")
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - id: release
        if: steps.origin.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out=$(release-plz release --git-token "$GITHUB_TOKEN" -o json)
          echo "$out"
          # Every member is released at the one version; only torrentd has
          # the tag and the release (release-plz.toml).
          tag=$(jq -r '[.releases[] | select(.package_name == "torrentd")][0].tag // ""' <<< "$out")
          version=$(jq -r '[.releases[] | select(.package_name == "torrentd")][0].version // ""' <<< "$out")
          # A re-run after an earlier attempt created the tag and the draft
          # and then failed (moving or verifying the tag, below): release-plz
          # finds the tag and releases nothing. The release is resumed from
          # this commit's version while its release is still a draft, so the
          # tag step and the build and publish jobs run again; a published
          # release, or none, leaves the run doing nothing.
          if [ -z "$tag" ]; then
            current=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/torrentd/Cargo.toml", "rb"))["package"]["version"])')
            draft=$(gh api --paginate "repos/$REPO/releases" \
              --jq ".[] | select(.draft and .tag_name == \"v$current\") | .id")
            if [ -n "$draft" ]; then
              echo "resuming the draft release of v$current"
              tag=v$current
              version=$current
            fi
          fi
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::release-plz tagged $tag for version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # release-plz makes the tag an annotated tag object through the API,
      # which nobody signs, so GitHub shows it unverified. The release is
      # still a draft, and immutable releases freeze the tag only once it is
      # published, so the tag is moved to the commit itself: a lightweight
      # tag on the merge commit GitHub made and signed. A tagged commit
      # GitHub does not verify fails the job, so nothing is built or
      # published from it.
      - if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG")
          type=$(jq -r .object.type <<< "$ref")
          object=$(jq -r .object.sha <<< "$ref")
          case "$type" in
            tag) commit=$(gh api "repos/$REPO/git/tags/$object" \
                   --jq 'select(.object.type == "commit") | .object.sha') ;;
            # A re-run, after an earlier attempt already moved it.
            commit) commit=$object ;;
            *) echo "::error::$TAG points at a $type"; exit 1 ;;
          esac
          if [ "$commit" != "$SHA" ]; then
            echo "::error::$TAG names $commit, not the released commit $SHA"
            exit 1
          fi
          if [ "$type" = tag ]; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" -f sha="$commit" -F force=true \
              --jq '.object | "\(.type) \(.sha)"'
          fi
          verification=$(gh api "repos/$REPO/commits/$commit" --jq .commit.verification)
          echo "$verification"
          if [ "$(jq -r .verified <<< "$verification")" != true ]; then
            echo "::error::GitHub does not verify $TAG's commit $commit ($(jq -r .reason <<< "$verification")); the draft release stays unpublished"
            exit 1
          fi

  release-pr:
    name: release pull request
    if: github.event_name == 'push'
    # After `release`, so a merged release pull request's tag exists before
    # the next one is computed; otherwise this run would propose the version
    # just released all over again.
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # The release branch, its commit, and deleting stale release branches,
      # all through the API.
      contents: write
      pull-requests: write # open, update and label the release pull request
      actions: write # `gh workflow run` on the release branch
    # One release pull request: a second run waits for the first to finish
    # rather than racing it on the same branch.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    env:
      # The one release branch. Its `release-plz-` prefix is what makes
      # `release-plz release` treat the merge of its pull request as a
      # release. This job owns it and replaces it on every run: a commit
      # pushed to it by hand is overwritten by the next push to `master`.
      BRANCH: release-plz-next
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      # Builds torrentd to regenerate the OpenAPI document, like ci.yml's
      # openapi-check does, from the same caches.
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
          cache-prefix: cargo
      # Restore only. The key is computed from this checkout of `master`, but
      # torrentd is built after `release-plz update`, whose bumped
      # crates/libtorrent-sys/Cargo.toml names a different prefix: saving
      # would store, under `master`'s exact key, a cache lacking the prefix
      # that key names, and every later job would take it as a hit and skip
      # the vendor fetch. For the same reason a hit here proves nothing about
      # the release, so the regeneration step below fetches the submodules
      # itself, whatever this restored.
      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}
          save: 'false'
      # release-plz stashes and checks out in a scratch copy of the repository
      # while it computes the update, which git refuses to do without an
      # identity. Nothing is committed with it: the commit below is made
      # through the API.
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # The versions and CHANGELOG.md entry the next release moves, in this
      # checkout and staged. `release-plz release-pr` would compute the same
      # and then push it to a new timestamped branch on every run, and fail
      # the run where GitHub refuses it a pull request.
      - id: update
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          release-plz update --repo-url "$REPO_URL"
          # Tracked files only: release-plz edits manifests, Cargo.lock and
          # CHANGELOG.md, and nothing a setup step left behind is staged.
          git add --update
          if git diff --cached --quiet --ignore-submodules=all HEAD; then
            echo "nothing to release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat --ignore-submodules=all HEAD
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/torrentd/Cargo.toml", "rb"))["package"]["version"])')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The document's `info.version` is the crate version just moved, so the
      # committed copy is stale until it is regenerated, and ci.yml's
      # openapi-check would fail the release pull request.
      - if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Unconditionally: build.rs rebuilds the prefix whenever its stamp
          # differs from what was restored.
          mise run native-fetch
          mise run openapi
          git add --update -- docs/api/openapi.json
      # The staged change becomes one commit on the pushed commit, made
      # through the GraphQL API so GitHub signs and verifies it, and the
      # release branch is moved onto it.
      - id: commit
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.update.outputs.version }}
          # Not `release-plz-*`: neither a release branch nor one the
          # pruning below would touch.
          SCRATCH: release-scratch-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          title="chore: release v$VERSION"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          # The pull request's body: the CHANGELOG.md entry this release adds.
          {
            echo "Merging this pull request releases v$VERSION: release-plz.yml tags the merge commit, then builds, signs and publishes the release."
            echo
            git diff --cached --unified=0 HEAD -- CHANGELOG.md | sed -n '/^+++ /d; s/^+//p'
          } | head -c 60000 > "$RUNNER_TEMP/pr-body.md"
          status=0
          remote=$(git ls-remote --exit-code origin "refs/heads/$BRANCH") || status=$?
          case $status in
            0) head=${remote%%[[:space:]]*} ;;
            2) head= ;;
            *) echo "::error::git ls-remote origin exited $status"; exit 1 ;;
          esac
          if [ -n "$head" ]; then
            git fetch --no-tags origin "$head"
            # A re-run on the same commit: the branch already holds this
            # release, so its commit is left alone. The steps below still
            # dispatch the checks and open or update the pull request, since
            # the attempt being re-run may have failed before either.
            if [ "$(git rev-parse "$head^")" = "$SHA" ] \
              && git diff --cached --quiet --ignore-submodules=all "$head"; then
              echo "$BRANCH already holds this release of $SHA"
              exit 0
            fi
          fi
          # The commit is made on a scratch branch at the pushed commit and
          # the release branch then moved onto it. Resetting the release
          # branch to `master` first would, for that moment, make its open
          # pull request's head a commit `master` contains, which GitHub
          # takes for a merge and closes the pull request as merged.
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$SCRATCH" -f sha="$SHA" --silent
          trap 'gh api -X DELETE "repos/$REPO/git/refs/heads/$SCRATCH" || echo "::warning::could not delete $SCRATCH"' EXIT
          echo '[]' > "$RUNNER_TEMP/additions.json"
          git diff --cached --name-only --diff-filter=d --ignore-submodules=all -z HEAD |
            while IFS= read -r -d '' path; do
              jq --arg path "$path" --rawfile contents <(base64 -w0 -- "$path") \
                '. + [{path: $path, contents: $contents}]' \
                "$RUNNER_TEMP/additions.json" > "$RUNNER_TEMP/additions.next"
              mv "$RUNNER_TEMP/additions.next" "$RUNNER_TEMP/additions.json"
            done
          git diff --cached --name-only --diff-filter=D --ignore-submodules=all -z HEAD |
            jq -Rs 'split("\u0000") | map(select(. != "") | {path: .})' > "$RUNNER_TEMP/deletions.json"
          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repo "$REPO" --arg branch "$SCRATCH" --arg head "$SHA" --arg headline "$title" \
            --slurpfile additions "$RUNNER_TEMP/additions.json" \
            --slurpfile deletions "$RUNNER_TEMP/deletions.json" \
            '{query: $query, variables: {input: {
               branch: {repositoryNameWithOwner: $repo, branchName: $branch},
               expectedHeadOid: $head,
               message: {headline: $headline},
               fileChanges: {additions: $additions[0], deletions: $deletions[0]}
             }}}' > "$RUNNER_TEMP/commit.json"
          commit=$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid)
          echo "$commit"
          if [ -n "$head" ]; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$commit" -F force=true --silent
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$commit" --silent
          fi
      # Anything this workflow's token pushes triggers no workflow, so CI and
      # the dry run of the build jobs (`dist`, `dist-musl`, `image`) are
      # dispatched on the branch. Their checks land on its head commit, which
      # is the release pull request's.
      - if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          gh workflow run release-plz.yml --repo "$REPO" --ref "$BRANCH"
      # Opens the release pull request, or retitles an open one. Where GitHub
      # refuses this workflow's token a pull request (the setting that lets
      # GitHub Actions create pull requests is off), the run stays green and
      # its summary carries the link to open it by hand; the branch, its
      # commit and its checks are already in place.
      - if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          TITLE: ${{ steps.commit.outputs.title }}
        run: |
          set -euo pipefail
          body=$RUNNER_TEMP/pr-body.md
          # `owner:branch` names this repository's branch, never a fork's.
          pr=$(gh api "repos/$REPO/pulls?state=open&base=master&head=${REPO%%/*}:$BRANCH" \
            --jq '.[0].number // ""')
          if [ -n "$pr" ]; then
            gh api -X PATCH "repos/$REPO/pulls/$pr" -f title="$TITLE" -F body=@"$body" --jq .html_url
            exit 0
          fi
          status=0
          out=$(gh api -X POST "repos/$REPO/pulls" -f base=master -f head="$BRANCH" \
            -f title="$TITLE" -F body=@"$body" --jq '"\(.number) \(.html_url)"' 2>&1) || status=$?
          echo "$out"
          if [ "$status" -eq 0 ]; then
            gh api "repos/$REPO/issues/${out%% *}/labels" -f 'labels[]=release' --silent \
              || echo "::warning::could not label the release pull request 'release'"
            exit 0
          fi
          if ! grep -q 'not permitted to create or approve pull requests' <<< "$out"; then
            echo "::error::opening the release pull request failed"
            exit 1
          fi
          url="$SERVER/$REPO/compare/master...$BRANCH?expand=1&title=$(jq -rn --arg t "$TITLE" '$t | @uri')"
          echo "::notice title=Open the release pull request by hand::GitHub refuses this workflow a pull request; $BRANCH holds $TITLE. Open it at $url"
          {
            echo "## Open the release pull request by hand"
            echo
            echo "GitHub refused this workflow's token a pull request. \`$BRANCH\` holds **$TITLE** as a verified commit on this push's \`master\`, and CI and the release dry run are dispatched on it."
            echo
            echo "[Open the pull request from \`$BRANCH\`]($url), with the body below. Merging it releases v${TITLE##* v}."
            echo
            cat "$body"
          } >> "$GITHUB_STEP_SUMMARY"
      # Nothing to release, as after a release pull request's merge: the
      # branch would only restate `master`, and deleting it closes any pull
      # request still open from it.
      - if: steps.update.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null || status=$?
          case $status in
            0) gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"; echo "deleted $BRANCH" ;;
            2) echo "no $BRANCH to delete" ;;
            *) echo "::error::git ls-remote origin exited $status"; exit 1 ;;
          esac
      # `release-plz release-pr` left a timestamped `release-plz-<date>T<time>Z`
      # branch on every run. Each one with no open pull request is deleted;
      # other `release-plz-*` branches, which a person named, are left alone.
      - if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | "\(.head.repo.full_name // "") \(.head.ref)"')
          refs=$(gh api --paginate "repos/$REPO/git/matching-refs/heads/release-plz-" --jq '.[].ref')
          while IFS= read -r ref; do
            branch=${ref#refs/heads/}
            [[ $branch =~ ^release-plz-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$ ]] || continue
            if grep -qxF "$REPO $branch" <<< "$open"; then
              echo "kept $branch: a pull request is open from it"
              continue
            fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "deleted $branch"
          done <<< "$refs"

  dist:
    name: dist (x86_64 glibc)
    needs: release
    # `!cancelled()` because `release` is skipped on a dry run (a pull
    # request, or a dispatch), and a skipped need otherwise skips this job too.
    if: >-
      !cancelled() && (github.event_name != 'push'
      || (needs.release.result == 'success' && needs.release.outputs.tag != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          persist-credentials: false
      # No cargo or native cache: a release is built from the tagged sources
      # alone, never from a target/ or a libtorrent prefix an earlier run
      # left. The vendored submodules are fetched and libtorrent is built.
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
      - run: mise run native-fetch
      # Empty on a dry run, where there is no tag to hold the build to.
      - run: mise run dist
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-gnu
          path: target/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  dist-musl:
    name: dist (static torrentctl, x86_64 musl)
    needs: release
    if: >-
      !cancelled() && (github.event_name != 'push'
      || (needs.release.result == 'success' && needs.release.outputs.tag != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          persist-credentials: false
      # musl-gcc compiles ring's C for the musl target; it comes with the
      # system deps, whose libtorrent half goes unused. torrentctl does not
      # link libtorrent, so the submodules are not fetched.
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
          extra-packages: musl-tools
      - run: mise run dist-musl
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-musl
          path: target/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  image:
    name: image (ghcr.io)
    needs: [release, dist, dist-musl]
    # After the tarballs, so a release whose binaries fail their checks
    # pushes no image and moves no tag.
    if: >-
      !cancelled() && needs.dist.result == 'success' && needs.dist-musl.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read # the checkout
      packages: write # push the image, its signature and its attestations
      id-token: write # keyless Sigstore signing and the attestations' certificates
      attestations: write # record the attestations with GitHub
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The build context carries the vendored sources (deploy/Containerfile).
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z, X.Y and latest, from the release's tag. Nothing is tagged
          # on a dry run, where nothing is pushed.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }},enable=${{ env.PUBLISH }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }},enable=${{ env.PUBLISH }}
            type=raw,value=latest,enable=${{ env.PUBLISH }}
          flavor: latest=false
      # Built once and loaded, so the binary inside is checked before
      # anything is pushed. No build cache: like the tarballs, the image is
      # built from the tagged sources alone. buildx's own provenance and SBOM
      # are off; the Sigstore attestations below are the image's.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Containerfile
          load: true
          push: false
          tags: torrentd:release-check
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - name: The image's torrentd is this release's
        env:
          EXPECTED: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # On a dry run there is no release; the checkout's version is
          # what the image was built from.
          expected=${EXPECTED:-$(python3 -c 'import tomllib; print(tomllib.load(open("crates/torrentd/Cargo.toml", "rb"))["package"]["version"])')}
          got=$(docker run --rm --entrypoint /usr/local/bin/torrentd torrentd:release-check --version)
          if [ "$got" != "torrentd $expected" ]; then
            echo "::error::the image's torrentd --version printed '$got', expected 'torrentd $expected'"
            exit 1
          fi
          echo "$got"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The same build again, from the builder's layers, now pushed.
      - id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - if: env.PUBLISH == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image.spdx.json
          push-to-registry: true

  publish:
    name: sign, attest and publish the release
    needs: [release, dist, dist-musl, image]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.release.outputs.tag != ''
      && needs.dist.result == 'success' && needs.dist-musl.result == 'success'
      && needs.image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # upload to the draft release and publish it
      id-token: write # keyless Sigstore signing and the attestations' certificates
      attestations: write # record the attestations with GitHub
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The sources the tarballs were built from, for their SBOM.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      # The crates both binaries are built from, read from Cargo.lock. The
      # vendored libtorrent and Boost are pinned submodules, which this does
      # not list.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/assets/torrent-${{ needs.release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - working-directory: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*.tar.gz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/assets/*.tar.gz
          sbom-path: ${{ runner.temp }}/assets/torrent-${{ needs.release.outputs.version }}.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - working-directory: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          for f in *.tar.gz *.spdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      # Every asset onto the draft, then publish it: the release becomes
      # immutable, assets and tag, from that moment. `--clobber` so a re-run
      # of this job, after an earlier attempt uploaded some assets and then
      # failed, replaces them on the still-draft release instead of failing
      # on the names already there. Immutable releases (above) freeze a
      # published release's assets, so this cannot replace a released one.
      - working-directory: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          gh release upload "$TAG" --clobber -- *.tar.gz *.spdx.json SHA256SUMS *.sigstore.json
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[].name]}'
