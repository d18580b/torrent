name: Mutants

# Mutation testing with cargo-mutants, advisory for now: every mutants step
# has `continue-on-error`, so a missed mutant, a timeout or the time cap
# marks the step and leaves the job, and the pull request's checks, green.
# What each run found is in its annotations and its `mutants.out` artifact.
#
# - in-diff: on a pull request, the mutants in the Rust lines it changes,
#   as many as fit in 12 minutes. The job's header says why it always
#   ends green inside its 28-minute cap.
# - shard: nightly, every mutant in the workspace in eight shards.
# - netns: nightly, the kill switch and WireGuard, whose decisive tests need
#   a real kernel network stack, in a network namespace.
#
# Every command is a mise task (mise.toml's mutants section), and these
# jobs provision the way ci.yml's do; its header comments apply here.
#
# No job caches cargo's registry or target/ (setup-rust's cache-prefix is
# left empty). cargo-mutants builds every mutant in a copy of the tree
# without target/, so a cached one would speed up nothing but the prefix
# lookup, and a restored target/ would carry an earlier run's mutants.out,
# which the upload step would publish as this run's whenever the job
# failed before cargo-mutants replaced it.

on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the run on the older head.
concurrency:
  group: mutants-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # ci.yml says why this must equal build.rs's default.
  LIBTORRENT_SYS_CACHE_DIR: /home/runner/.cache/torrentd/native
  INSTA_UPDATE: 'no'

jobs:
  # A pull request's check stays pending for as long as this runs, so it is
  # bounded to end green in under 30 minutes. Every step has a cap and
  # `continue-on-error`, so a step that fails or times out marks only itself;
  # each step after setup runs only when the steps it needs succeeded, and
  # otherwise is skipped. The step caps sum to 26 minutes (checkout 3, diff 1,
  # setup-rust 6, native-cache 3, cargo mutants 12, upload 1), under the
  # job's 28, so a step always times out before the job does: a job-level
  # timeout is the one end `continue-on-error` cannot turn green. The two
  # minutes left are for the runner's set-up and the actions' post steps.
  # A native-cache miss needs ~4 minutes to fetch the vendor submodules, so
  # it times out at 3 and the run is skipped; the nightly jobs fill the cache.
  in-diff:
    name: mutants in the diff (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          submodules: false
          # The diff is taken from the merge base, so the base's history
          # has to be here.
          fetch-depth: 0
          persist-credentials: false

      # A pull request that changes no Rust line has no mutant to test, so
      # it skips the toolchain and native prefix as well as the run.
      - id: diff
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet --merge-base "$BASE" -- '*.rs'; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi

      - id: setup-rust
        if: steps.diff.outcome == 'success' && steps.diff.outputs.rust == 'true'
        uses: ./.github/actions/setup-rust
        continue-on-error: true
        timeout-minutes: 6
        with:
          system-deps: 'true'

      - id: native-cache
        if: steps.setup-rust.outcome == 'success'
        uses: ./.github/actions/native-cache
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}
          # Restore only. This job ends green when the fetch or the run times
          # out, so a save here would store the restored prefixes under the
          # new key without the one it names, and every later job would hit
          # it, skip the vendor fetch, and fail in libtorrent-sys's build.rs.
          save: 'false'

      - if: steps.native-cache.outcome == 'success'
        name: cargo mutants --in-diff
        continue-on-error: true
        timeout-minutes: 12
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: mise run mutants-diff "$BASE"

      - if: always() && steps.diff.outputs.rust == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        timeout-minutes: 1
        with:
          name: mutants-in-diff
          path: target/mutants.out
          if-no-files-found: ignore

  shard:
    name: mutants shard ${{ matrix.shard }}/8 (nightly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'

      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}

      # Stopped short of the job's own limit, so the steps after it still
      # run and upload what the shard got through.
      - name: cargo mutants --shard
        continue-on-error: true
        timeout-minutes: 320
        env:
          SHARD: ${{ matrix.shard }}
        run: mise run mutants-shard "$SHARD/8"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: target/mutants.out
          if-no-files-found: ignore

  netns:
    name: mutants in a real kernel (nightly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
          extra-packages: nftables wireguard-tools iproute2 util-linux

      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}

      # The same host setup as ci.yml's vpn-netns job, which says why each
      # line is needed.
      - name: Allow unprivileged user namespaces, and load wireguard
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo modprobe -a wireguard nf_tables veth
          sudo install -d -m 0700 /etc/wireguard
          nft --version
          unshare --user --map-root-user --net -- ip link add probe type wireguard

      - name: cargo mutants in a network namespace
        continue-on-error: true
        timeout-minutes: 320
        run: mise run mutants-netns

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-netns
          path: target/mutants.out
          if-no-files-found: ignore
