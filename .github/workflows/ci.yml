name: CI

on:
  push:
    # The default branch is `master`. This said `main`, so no push to the
    # default branch has ever run CI — every check has come from the
    # pull_request trigger, leaving post-merge `master` unverified.
    branches: [master]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository. The cache actions authenticate with the
# runner's own cache token, not GITHUB_TOKEN, so they need no grant here.
permissions:
  contents: read

# Every action below is pinned to a commit SHA, with the release it was cut
# from in the trailing comment: a tag or branch can be moved under a workflow,
# a commit cannot.
#
# Every command a job runs is a mise task, defined once in mise.toml and run
# the same way locally. RUSTFLAGS (-D warnings) comes from mise.toml's [env].
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Must equal the $XDG_CACHE_HOME/torrentd/native default build.rs
  # computes, so a developer and CI resolve the same prefix layout.
  LIBTORRENT_SYS_CACHE_DIR: /home/runner/.cache/torrentd/native
  # insta never writes or accepts a snapshot here: a snapshot that differs
  # only fails the test. Its default, `auto`, leaves that to its own guess at
  # whether it runs in CI. Quoted: a bare `no` is a YAML 1.1 boolean.
  INSTA_UPDATE: 'no'

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          persist-credentials: false
      # Nightly is required ONLY for rustfmt (imports_granularity / group_imports
      # are unstable). mise.toml's RUSTFMT_TOOLCHAIN names the dated nightly;
      # `rustfmt-toolchain` installs it and `fmt` runs `cargo +` that nightly.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ''
      - run: mise run rustfmt-toolchain
      - run: mise run fmt

  clippy-and-test:
    name: clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
          cache-prefix: cargo

      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}

      # Clippy over the default, fault-injection and shim-tests builds.
      - run: mise run lint

      - run: mise run test

      # The committed OpenAPI document is what `torrentd openapi` prints from
      # this tree; a handler change that did not regenerate it fails here.
      - run: mise run openapi-check

      # The alert drill's build mounts `POST /v1/faults` and wraps every engine
      # in `FaultEngine`; nothing else compiles that code, and until this ran
      # the tests rather than `cargo check`ing them, nothing executed its tests.
      - run: mise run test-fault-injection

  msrv:
    name: builds on the MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      # The pinned stable toolchain is installed too: mise's cargo tools build
      # with it. `msrv` installs the rust-version release itself.
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
          cache-prefix: cargo-msrv
          # rust-version picks this job's compiler, so an MSRV bump must
          # miss the cache rather than restore the old compiler's target/.
          cache-key-file: Cargo.toml

      # `cargo check` still runs libtorrent-sys's build script, which under
      # the default `bundled` feature provisions the native prefix and
      # compiles the shim, so it reuses the cached prefix like every build.
      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}

      # Cargo.toml's rust-version is a promise nothing else in CI tests: every
      # other job builds on rust-toolchain.toml's newer release.
      - run: mise run msrv

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          persist-credentials: false
      # `cargo deny` reads `cargo metadata`, so it needs cargo, not a build.
      - uses: ./.github/actions/setup-rust
      # Advisories, licenses, bans and sources, against deny.toml.
      - run: mise run deny

  release-features:
    name: release build has no fault injection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          persist-credentials: false
      # `cargo tree` reads `cargo metadata`, so it needs cargo, not a build.
      - uses: ./.github/actions/setup-rust
      # The feature set deploy/Containerfile's release build resolves must
      # leave `fault-injection` and the engine's `test-support` off.
      - run: mise run release-features

  tracing-lint:
    name: tracing field-name lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          persist-credentials: false
      # Only a grep, but mise owns it like every other check.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ''
      - run: mise run lint-tracing

  size-check:
    name: file-length gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          persist-credentials: false
      # Source files over the limit must be in .size-baseline, which may only
      # shrink. Needs git and bash, not a toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ''
      - run: mise run size-check

  shim-tests:
    name: shim FFI tests (Layer 2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
          cache-prefix: cargo-shimtests

      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}
          # tests/shim.rs reads .torrent fixtures from the vendored corpus.
          fixtures: 'true'

      # Layer 2: struct marshalling, exception isolation,
      # null-handle safety, and buffer ownership across the C ABI boundary.
      - run: mise run test-shim

  shim-asan:
    name: shim ownership under ASan (Layer 2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      # Builds no Rust. clang carries its ASan runtime in compiler-rt
      # (libclang-rt-18-dev on 24.04) and llvm-18 its symbolizer; GCC's
      # runtime is the libasan package the native deps do not install.
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
          extra-packages: clang libclang-rt-18-dev llvm-18
          toolchain: ''

      # The instrumented libtorrent prefix, cached on the key prefix.sh would
      # build it under: the vendor commits, the compilers, OpenSSL and the
      # script's flags. Not the shared native cache: that prefix is
      # uninstrumented, and this one is useful to no other job.
      - id: asan-key
        run: |
          set -euo pipefail
          key=$(crates/libtorrent-sys/tests/asan/prefix.sh --key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: asan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}
          key: shim-asan-v1-${{ runner.os }}-${{ steps.asan-key.outputs.key }}
      # The test generates its own .torrent inputs, so a cached prefix needs
      # no submodule at all.
      - if: steps.asan-cache.outputs.cache-hit != 'true'
        run: mise run native-fetch

      # Every shim heap payload read whole, freed, and freed again where the
      # contract allows; inputs in exact-size blocks; LeakSanitizer at exit.
      - run: mise run test-shim-asan

  integration:
    name: daemon integration (Layer 3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
          cache-prefix: cargo-integration

      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}

      # Layer 3: real daemon + libtorrent, driven over HTTP.
      - run: mise run test-lifecycle
      - run: mise run test-daemon
      - run: mise run test-torrentctl

  vpn-netns:
    name: VPN in a real kernel (netns)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          system-deps: 'true'
          extra-packages: nftables wireguard-tools iproute2 util-linux
          cache-prefix: cargo-netns

      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}

      # The only privileged steps. The tests create their own user and
      # network namespaces, so they need no root themselves, but Ubuntu
      # 24.04's AppArmor refuses an unprivileged user namespace unless this
      # is lifted, and a module cannot be loaded from inside one. Everything
      # after this runs as the runner's user, exactly as on a developer's
      # machine, so `target/` and the caches stay the runner's to save.
      # This is the runner's own host setup, not a check, so it stays here
      # rather than in a mise task a developer could run on their machine.
      - name: Allow unprivileged user namespaces, and load wireguard
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo modprobe -a wireguard nf_tables veth
          # The e2e mounts a tmpfs of its own over this; it has to exist.
          sudo install -d -m 0700 /etc/wireguard
          nft --version
          unshare --user --map-root-user --net -- ip link add probe type wireguard

      # The kill switch's real-nft tests (against this runner's nft, not the
      # release its JSON fixtures came from), WireGuard's live links, the
      # listen-device test, and the daemon end to end over a real tunnel,
      # asserting nothing leaks outside it.
      - run: mise run test-netns

  container:
    name: container image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      # The image builds its own toolchain; mise only runs the task.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ''
      # Nothing built deploy/Containerfile once, which is how it sat broken
      # for a while; building it here keeps the image's builder stage honest.
      - run: mise run container

  alert-rules:
    name: alert rules (promtool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          persist-credentials: false
      # mise provides the task, which runs promtool from the pinned Prometheus
      # image on the runner's docker.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ''
      - run: mise run test-alerts

  commit-lint:
    name: conventional commits
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ''
      # Backstop the local commit-msg hook against `--no-verify`: every commit the
      # PR adds must be a valid Conventional Commit (the task the hook runs).
      - run: mise run commit-lint "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
