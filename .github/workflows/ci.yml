name: CI

on:
  push:
    # The default branch is `master`. This said `main`, so no push to the
    # default branch has ever run CI — every check has come from the
    # pull_request trigger, leaving post-merge `master` unverified.
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  # Must equal the $XDG_CACHE_HOME/torrentd/native default build.rs
  # computes, so a developer and CI resolve the same prefix layout.
  LIBTORRENT_SYS_CACHE_DIR: /home/runner/.cache/torrentd/native

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # Nightly is required ONLY for rustfmt (imports_granularity / group_imports
      # are unstable). The mise `fmt` task invokes `cargo +nightly fmt`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # cargo-binstall lets mise fetch a prebuilt convco (no compile / C build deps).
      - uses: cargo-bins/cargo-binstall@main
      - uses: jdx/mise-action@v2
      - run: mise run fmt

  clippy-and-test:
    name: clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libclang-dev

      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy

      # cargo-binstall lets mise fetch a prebuilt convco (no compile / C build deps).
      - uses: cargo-bins/cargo-binstall@main
      - uses: jdx/mise-action@v2

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # fmt/lint/test commands are defined once in mise.toml (parity with local hooks).
      - run: mise run lint

      - run: mise run test

      # The committed OpenAPI document is what `torrentd openapi` prints from
      # this tree; a handler change that did not regenerate it fails here.
      - run: mise run openapi-check

      # The alert drill's build mounts `POST /v1/faults` and wraps every engine
      # in `FaultEngine`; nothing else compiles that code.
      - run: mise run check-fault-injection

  tracing-lint:
    name: tracing field-name lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Reject info_hash typos and bare infohash logs
        run: |
          set -euo pipefail
          # Common typo: info_hash in a Rust tracing field name.
          # Scoped to *.rs so we don't flag legitimate C++ includes of
          # libtorrent's real header (<libtorrent/info_hash.hpp>) in the shim.
          if grep -RnE --include='*.rs' '\binfo_hash\b' crates/; then
            echo "::error::Field name must be 'infohash' (no underscore)."
            exit 1
          fi
          # The log field is `profile_id`. `slot_id` was its name before
          # profiles replaced slots, and a stray one silently splits every log
          # query in two.
          if grep -RnE --include='*.rs' '\bslot_id\b' crates/; then
            echo "::error::use profile_id, not slot_id"
            exit 1
          fi
          # Free-standing log lines that emit `infohash =` outside an
          # instrument-decorated function aren't strictly forbidden, but
          # we want the parent span to carry the field. Soft warn only.
          if grep -RnE --include='*.rs' 'tracing::(info|warn|error|debug)!\([^)]*infohash *=' crates/ | grep -v 'fields(' >/dev/null; then
            echo "::warning::Free-standing infohash field in a log macro; prefer #[instrument] on the parent function."
          fi

  shim-tests:
    name: shim FFI tests (Layer 2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}
          # tests/shim.rs reads .torrent fixtures from the vendored corpus.
          fixtures: 'true'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libclang-dev

      - uses: dtolnay/rust-toolchain@1.90

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-shimtests-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-shimtests-${{ runner.os }}-

      # mise provides the test tasks; without it these jobs would be a second
      # copy of the commands mise.toml already owns.
      # cargo-binstall lets mise fetch a prebuilt convco (no compile / C build deps).
      - uses: cargo-bins/cargo-binstall@main
      - uses: jdx/mise-action@v2

      # Layer 2: struct marshalling, exception isolation,
      # null-handle safety, and buffer ownership across the C ABI boundary.
      - run: mise run test-shim

  integration:
    name: daemon integration (Layer 3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: ./.github/actions/native-cache
        with:
          path: ${{ env.LIBTORRENT_SYS_CACHE_DIR }}

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libclang-dev

      - uses: dtolnay/rust-toolchain@1.90

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-integration-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-integration-${{ runner.os }}-

      # mise provides the test tasks; without it these jobs would be a second
      # copy of the commands mise.toml already owns.
      # cargo-binstall lets mise fetch a prebuilt convco (no compile / C build deps).
      - uses: cargo-bins/cargo-binstall@main
      - uses: jdx/mise-action@v2

      # Layer 3: real daemon + libtorrent, driven over HTTP.
      - run: mise run test-lifecycle
      - run: mise run test-daemon
      - run: mise run test-torrentctl

  container:
    name: container image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      # Nothing built deploy/Containerfile once, which is how it sat broken
      # for a while; building it here keeps the image's builder stage honest.
      - name: Build the image
        run: podman build -f deploy/Containerfile -t torrentd:ci .

  alert-rules:
    name: alert rules (promtool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # mise provides the task, which runs promtool from the pinned Prometheus
      # image on the runner's docker.
      # cargo-binstall lets mise fetch a prebuilt convco (no compile / C build deps).
      - uses: cargo-bins/cargo-binstall@main
      - uses: jdx/mise-action@v2
      - run: mise run test-alerts

  commit-lint:
    name: conventional commits
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      # cargo-binstall lets mise fetch a prebuilt convco (no compile / C build deps).
      - uses: cargo-bins/cargo-binstall@main
      - uses: jdx/mise-action@v2
      # Backstop the local commit-msg hook against `--no-verify`: every commit the
      # PR adds must be a valid Conventional Commit (same convco used on commit).
      - run: mise exec -- convco check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
