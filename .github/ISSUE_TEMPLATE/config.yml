# Blank issues stay enabled on purpose: this repository ships one template (the
# bug report), and most of the tracker is feature, testing and documentation
# work that no template specifies. Disabling blank issues would make that work
# unfileable through the chooser. The contact link below routes a vulnerability
# reporter to SECURITY.md, whose main route is private: the Security tab's
# **Report a vulnerability**, which opens a draft advisory and never touches
# this tracker. The policy keeps a public issue with a `security:` prefix only
# for findings that are already public or low-risk; there is deliberately no
# form for it, so a blank issue is how that one is filed.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/d18580b/torrent/blob/master/SECURITY.md
    about: >-
      Do not use the bug form. Read SECURITY.md and follow the reporting
      instructions there.
