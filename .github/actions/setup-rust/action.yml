name: setup-rust
description: >-
  Everything a CI job needs before its `mise run` steps: the native build's
  system packages, a Rust toolchain, the cargo registry and target cache, and
  mise with the tools mise.toml pins. Each part is optional, so a job that
  builds nothing still provisions mise the same way as one that builds.

inputs:
  system-deps:
    description: >-
      Install the apt packages libtorrent-sys's native build needs (a C++
      toolchain, CMake, Ninja, OpenSSL and libclang for bindgen).
    required: false
    default: 'false'
  extra-packages:
    description: >-
      Further apt packages, space separated, installed with the system deps.
    required: false
    default: ''
  toolchain:
    description: >-
      `rust-toolchain.toml` installs the toolchain and components that file
      pins, before anything builds. Empty installs none up front: a job that
      builds nothing needs none, and any cargo run in the checkout still makes
      rustup fetch the pinned one. Any other value is refused, so no job names
      a version that file would silently override. The rustfmt nightly and
      the MSRV are installed by their own mise tasks.
    required: false
    default: rust-toolchain.toml
  cache-prefix:
    description: >-
      Key prefix for the cargo registry and target cache, one per job so jobs
      that build different feature sets do not evict each other's target/.
      Empty disables the cache.
    required: false
    default: ''
  cache-key-file:
    description: >-
      One more file pattern whose contents the cache key hashes, beside
      Cargo.lock and rust-toolchain.toml, for a job whose compiler or build
      those two do not determine (the msrv job's comes from Cargo.toml's
      rust-version). An exact key hit is never re-saved, so whatever picks
      the compiler has to be in the key.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - if: inputs.system-deps == 'true'
      shell: bash
      env:
        EXTRA: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail
        sudo apt-get update
        # shellcheck disable=SC2086 # EXTRA is a space-separated package list.
        sudo apt-get install -y \
          build-essential cmake ninja-build pkg-config \
          libssl-dev libclang-dev \
          $EXTRA

    - if: inputs.toolchain != ''
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail
        if [ "$TOOLCHAIN" != rust-toolchain.toml ]; then
          echo "::error::toolchain must be 'rust-toolchain.toml' or empty, not '$TOOLCHAIN'"
          exit 1
        fi
        # With no name, rustup installs the active toolchain, which
        # rust-toolchain.toml names, with that file's profile and components.
        rustup toolchain install
        rustc --version

    - if: inputs.cache-prefix != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', inputs.cache-key-file || 'rust-toolchain.toml') }}
        restore-keys: ${{ inputs.cache-prefix }}-${{ runner.os }}-

    # cargo-binstall lets mise fetch prebuilt convco and cargo-deny binaries
    # (no compile, no C build deps).
    - uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
    # The mise release every task is run on, so a new mise cannot change a
    # task's behaviour under CI. mise.toml's `min_version` names the same
    # release; move both together.
    - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      with:
        version: 2026.10.17
