name: native-cache
description: >-
  Restore the shared vendored libtorrent/Boost prefix, and fetch the vendor
  submodules only when it missed. Runs mise's `native-fetch` task for that, so
  setup-rust must run first.

inputs:
  path:
    description: >-
      Directory holding the content-addressed native prefixes. Passed in
      explicitly rather than read from the env context, so the value is
      resolved by the workflow that owns it.
    required: true
  fixtures:
    description: >-
      Initialize vendor/libtorrent even on a cache hit. The shim FFI suite
      reads .torrent fixtures out of the pinned libtorrent test corpus
      (crates/libtorrent-sys/tests/shim/), so that job needs the tree on
      disk whether or not it needs to build anything. libtorrent alone is
      ~16 MB shallow; Boost, the expensive one, is still skipped.
    required: false
    default: 'false'
  save:
    description: >-
      Save the cache at the end of the job when the key missed. 'false'
      restores only, for a job that may succeed without building the prefix
      its key names: a step that times out under continue-on-error still
      ends the job green, and actions/cache would then save whatever was
      restored under the new exact key, which every later job takes as a
      hit and skips the vendor fetch it needs.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The gitlink SHAs come out of the superproject's own tree, so this works
    # with the submodules absent and costs ~1ms. The previous key used
    # hashFiles('vendor/libtorrent/**'), which walked the whole submodule on
    # every run and covered none of Boost's sources.
    #
    # This key is only a hit-rate heuristic. Correctness lives in the .stamp
    # file that build.rs compares: if the two ever disagree the worst outcome
    # is a rebuild, never a stale link -- provided an exact hit is only ever
    # saved by a job that built what its key names (see `save` above). The
    # restore-keys prefix stops at the two vendor SHAs so a shim-only edit
    # still restores the ~111 MB libtorrent prefix and rebuilds only the
    # ~4 MB shim. v2: v1 entries were saved by the advisory mutants job
    # without the prefix their key names; a new prefix leaves them unread.
    - id: ids
      shell: bash
      env:
        FILES_HASH: >-
          ${{ hashFiles('crates/libtorrent-sys/build.rs',
                        'crates/libtorrent-sys/Cargo.toml',
                        'crates/libtorrent-sys/wrapper.h',
                        'crates/libtorrent-sys/shim/**') }}
      run: |
        set -euo pipefail
        prefix="native-v2-${RUNNER_OS}-$(git rev-parse HEAD:vendor/libtorrent)-$(git rev-parse HEAD:vendor/boost)-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}${FILES_HASH}" >> "$GITHUB_OUTPUT"

    - id: cache
      if: inputs.save == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.ids.outputs.key }}
        restore-keys: ${{ steps.ids.outputs.prefix }}

    - id: restore
      if: inputs.save != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.ids.outputs.key }}
        restore-keys: ${{ steps.ids.outputs.prefix }}

    - id: hit
      shell: bash
      env:
        HIT: ${{ steps.cache.outputs.cache-hit || steps.restore.outputs.cache-hit }}
      run: echo "hit=${HIT:-false}" >> "$GITHUB_OUTPUT"

    # ~4 minutes per job. vendor/boost is a 165-sub-repo superproject and is
    # needed only to *build* the prefix, never to consume one. mise.toml's
    # native-fetch task says why libtorrent's libsimulator is skipped.
    - if: steps.hit.outputs.hit != 'true'
      shell: bash
      run: mise run native-fetch

    - if: inputs.fixtures == 'true' && steps.hit.outputs.hit == 'true'
      shell: bash
      run: git submodule update --init --depth 1 vendor/libtorrent

    # Makes the hit/miss visible in the job log: four jobs printing identical
    # stamps is the proof they share one prefix. The path reaches the script
    # through the environment, never pasted into it, so no input value can
    # become shell syntax.
    - shell: bash
      env:
        NATIVE_PATH: ${{ inputs.path }}
      run: |
        cat "$NATIVE_PATH"/*/.stamp 2>/dev/null \
          || echo "no native prefix restored; build.rs will provision one"
