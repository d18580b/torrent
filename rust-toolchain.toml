# Every build, lint and test runs on the latest stable release, locally, in CI
# and in deploy/Containerfile. The channel floats on purpose: Rust releases are
# backwards compatible, so a new release only adds syntax, lints and compiler
# speed, and anything it does break (usually a new clippy lint) is fixed here
# when it lands rather than avoided by pinning. Nothing needs bumping by hand.
# `rust-version` in Cargo.toml is only the floor the workspace must still
# compile on, which `mise run msrv` checks.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy", "rust-src"]
profile = "minimal"
