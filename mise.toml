# Developer tooling for the torrentd workspace.
#
# Single source of truth for the fmt, lint and test commands, and for the test
# and benchmark entry points layered above them: `hk` hooks, CI and the docs
# all call `mise run <task>`, so each command lives in exactly one place.
#
#   mise install         # provision the tools below
#   mise run setup       # install nightly rustfmt + activate the hooks (once)
#   mise run fmt|lint|test|check
#   mise run test-shim|test-lifecycle|test-daemon|test-torrentctl|test-all|test-alerts
#   mise run openapi|openapi-check|test-fault-injection|deny
#   mise run bench -- <subcommand>

[tools]
hk = "1.48.0"
# convco is not in the mise/aqua registry; the cargo backend fetches a prebuilt
# binary via cargo-binstall when available, else compiles from source.
"cargo:convco" = "0.6.4"
# Supply-chain policy (deny.toml): advisories, licenses, bans, sources. The
# cargo backend fetches the prebuilt binary through cargo-binstall.
"cargo:cargo-deny" = "0.20.2"
# pkl is intentionally omitted: hk parses hk.pkl with its built-in evaluator.
# Set HK_PKL_BACKEND=pkl and add `pkl` here only if you want the pkl CLI instead.

[env]
# Nightly is used ONLY for rustfmt: granular import normalization
# (imports_granularity / group_imports in rustfmt.toml) is an unstable feature.
# Everything else builds/lints/tests on the pinned stable toolchain.
RUSTFMT_TOOLCHAIN = "nightly"

[tasks.fmt]
description = "Check formatting (nightly rustfmt)"
run = "cargo +$RUSTFMT_TOOLCHAIN fmt --all --check"

[tasks.fmt-fix]
description = "Apply formatting (nightly rustfmt)"
run = "cargo +$RUSTFMT_TOOLCHAIN fmt --all"

[tasks.lint]
description = "Clippy across the workspace, warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.lint-fix]
description = "Clippy autofix — safe under the hk pre-commit hook (allows staged/dirty index)"
run = "cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings"

[tasks.test]
description = "Workspace tests (default features; parity with CI)"
run = "cargo test --workspace"

# The layers above `test`, each needing something `test` does not. The rule at
# the top of this file — that a command lives in exactly one place — now covers
# these too; until it did, the four were spelled out longhand in CI *and* in
# the README, so there were three copies of each and nothing kept them in step.

[tasks.test-shim]
description = "Layer 2: FFI shim tests (needs the vendored libtorrent fixtures)"
run = "cargo test -p libtorrent-sys --features shim-tests"

[tasks.test-lifecycle]
description = "Layer 3: real libtorrent sessions against real disk (no network)"
run = "cargo test -p torrentd-engine --test lifecycle -- --ignored"

[tasks.test-daemon]
description = "Layer 3: spawns the built binary and drives it over HTTP"
run = "cargo test -p torrentd --test daemon -- --ignored"

# The spargen-generated client torrentctl is built on, against a real daemon:
# the other half of the contract, a second tool's reading of the document held
# to the handlers. It spawns target/debug/torrentd, so builds it first.
[tasks.test-torrentctl]
description = "Layer 3: torrentctl's generated client against a spawned daemon"
run = [
  "cargo build -p torrentd",
  "cargo test -p torrentctl --test e2e -- --ignored",
]

[tasks.test-alerts]
description = "promtool: check deploy/prometheus's alert rules and run their fixtures (needs podman or docker)"
# In a container rather than as a [tools] entry: promtool ships only inside the
# Prometheus release, which no registry mise resolves packages as a tool, and
# the pinned image is the exact binary a deployment's Prometheus evaluates the
# rules with. `:Z` relabels the mount for SELinux hosts; docker ignores it
# elsewhere.
run = '''
set -eu
engine=$(command -v podman || command -v docker)
promtool() {
  "$engine" run --rm -v "$PWD/deploy/prometheus:/w:ro,Z" -w /w \
    --entrypoint promtool docker.io/prom/prometheus:v3.5.0 "$@"
}
promtool check rules torrentd.rules.yml
promtool test rules torrentd.rules.test.yml
'''

[tasks.test-all]
description = "Every automated test, including the ignored integration layers"
# Sequential `run`, not `depends`: mise schedules dependencies in parallel
# (`--jobs` defaults to 4, exactly the number of layers here). `test` and
# `test-shim` resolve `libtorrent-sys` features differently against one
# `target/`, so run together they thrash cargo's build-directory lock; and the
# two Layer 3 suites are wall-clock tests — a 15s seeding budget and a 30s
# daemon health deadline — which contention alone can miss, producing a red run
# that says nothing about the code. Ordering is the whole intent, so it is
# spelled out where a reader of the task can see it.
run = [
  "mise run test",
  "mise run test-fault-injection",
  "mise run test-shim",
  "mise run test-lifecycle",
  "mise run test-daemon",
  "mise run test-torrentctl",
  "mise run test-alerts",
]

[tasks.bench]
description = "Layer 4: memory and throughput at scale (manual; minutes, GBs of RAM). --release is hardcoded: an unoptimised build measures the debug build, which is not a number worth having."
run = "cargo run --release -p torrentd-bench --"

# The HTTP API's OpenAPI document, derived from the handlers by kynos and
# committed so a change to the contract shows up in review. `openapi-check` is
# the CI gate: it regenerates the file and fails if the committed copy differs.
[tasks.openapi]
description = "Regenerate docs/api/openapi.json from the handlers"
run = "cargo run -q -p torrentd -- openapi --out docs/api/openapi.json"

[tasks.openapi-check]
description = "Fail if docs/api/openapi.json is stale against the handlers"
run = [
  "cargo run -q -p torrentd -- openapi --out docs/api/openapi.json",
  "git diff --exit-code -- docs/api/openapi.json",
]

# The alert drill's build (deploy/drill), with its tests run. This used to be
# `cargo check --all-targets`, which proved the fault-injection code and its
# tests compile and never ran one: `POST /v1/faults`' scenarios and
# `FaultEngine`'s own tests exist only in this build, so nothing executed them.
[tasks.test-fault-injection]
description = "Run torrentd's tests in the fault-injection build"
run = "cargo test -p torrentd --features fault-injection"

# The dependency policy in deny.toml: RustSec advisories, licenses, duplicate
# and wildcard bans, and allowed sources. Reads Cargo.lock and the advisory
# database; builds nothing.
[tasks.deny]
description = "cargo-deny: advisories, licenses, bans and sources (deny.toml)"
run = "cargo deny check"

# Live verification against real VPN credentials. Deliberately separate from
# every `test` task: it needs a real host with real tunnels, it is the one
# check here that can touch the network, and it is meaningless in CI.
#
#   mise run vpn-check /etc/torrentd/torrentd.toml
#   mise run vpn-check /etc/torrentd/torrentd.toml -- --bring-up --json
#
# The exit status is the subcommand's: 0 clean, 1 any failure, 2 nothing
# failed but something could not be checked.
#
# Declared with `usage` rather than the `{{arg()}}` template: the template
# form cannot take a flag at all, so the second line above did not run, and
# the pinned mise deprecates it on every invocation. The flags are forwarded
# as a group rather than enumerated here — enumerating them would put a second
# copy of `vpn check`'s own flag surface in this file, to drift against it.
[tasks.vpn-check]
description = "Verify a real VPN configuration, with no torrents involved"
usage = '''
arg "<config>" help="Path to the torrentd config to check"
arg "<flags>" var=#true required=#false help="Flags for `vpn check`, e.g. --bring-up --json"
'''
run = '''
# mise shell-quotes each forwarded argument into $usage_flags, so
# `--profile "a b"` arrives as `--profile 'a b'`. A bare $usage_flags word-splits that on the space
# and hands the subcommand `'a` and `b'`; quoting it as "$usage_flags" passes
# the whole group as one argument, which is no better. `eval set --` re-parses
# mise's own quoting, which is the only form that round-trips both.
eval "set -- $usage_flags"
cargo run --quiet -p torrentd -- --config "$usage_config" vpn check "$@"
'''

# `depends` here, not the sequential `run` list `test-all` uses: mise schedules
# these two in parallel and that is safe, which is the boundary between the two
# forms. `fmt` is `cargo fmt --check` and never touches `target/`, so `lint` is
# the only member taking cargo's build-directory lock and has nothing to
# contend with; and neither task carries a wall-clock deadline. A composed task
# whose members share `target/` or race a timeout gets an ordered `run` list.
[tasks.check]
description = "Formatting + clippy"
depends = ["fmt", "lint"]

# The native prefix deliberately does NOT get its path from a [env] entry here:
# a bare `cargo build` outside mise has to resolve the same directory, so both
# sides independently expand ${XDG_CACHE_HOME:-$HOME/.cache}/torrentd/native.
[tasks.native]
description = "Provision the shared libtorrent/Boost prefix (first run: 5-15 min)"
run = [
  # Skipping libsimulator is not an optimisation: it builds libtorrent's
  # simulation tests, which nothing here consumes, and libtorrent pins a
  # commit that is not the tip of libsimulator's default branch -- which is
  # all a --depth 1 fetch can reach. Without this the nested checkout lands
  # on whatever that tip was, and vendor/libtorrent reads as
  # "(modified content)" in every `git status` from then on.
  "git -c 'submodule.simulation/libsimulator.update=none' submodule update --init --recursive --depth 1",
  "cargo build -p libtorrent-sys",
  # Honours LIBTORRENT_SYS_CACHE_DIR, which build.rs checks before XDG, and
  # tolerates the glob not matching rather than failing a 15-minute task.
  'ls -d "${LIBTORRENT_SYS_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/torrentd/native}"/*/ || true',
]

[tasks.native-clean]
description = "Delete every cached native prefix (~115 MB per pinned version)"
run = 'rm -rf "${LIBTORRENT_SYS_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/torrentd/native}"'

# Deliberately does NOT depend on `native`: installing the git hooks should not
# cost a 15-minute, 1.5 GB provision for someone who only wants the hooks.
[tasks.setup]
description = "One-time dev setup: nightly rustfmt toolchain + activate git hooks"
run = [
  "rustup toolchain install nightly --profile minimal --component rustfmt",
  "hk install",
]
